<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小棒拼图形 · 除法可视化</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <style>
        /* ========== CSS 变量 ========== */
        :root {
            --bg-deep: #0a0b12;
            --bg-panel: rgba(16, 18, 30, 0.72);
            --border-glow: rgba(168, 85, 247, 0.20);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --text-primary: #f0f0fc;
            --text-secondary: #8a8fb8;
            --text-muted: #5d618a;

            --accent-1: #a855f7;
            --accent-2: #ff007f;
            --accent-3: #ff4500;
            --gradient-main: linear-gradient(135deg, #a855f7 0%, #ff007f 100%);
            --gradient-hover: linear-gradient(135deg, #be63f9 0%, #ff2b93 100%);
            --gradient-text: linear-gradient(90deg, #ff4500, #ff007f, #a855f7);

            --glow-purple: rgba(168, 85, 247, 0.35);
            --glow-pink: rgba(255, 0, 127, 0.30);

            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
            --shadow-card: 0 20px 60px rgba(0, 0, 0, 0.6);
            --shadow-glow: 0 0 40px rgba(168, 85, 247, 0.10);

            --transition-smooth: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-bounce: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ========== 全局重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ========== 动态背景 ========== */
        .bg-ambient {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-ambient .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.30;
            animation: orbFloat 20s ease-in-out infinite alternate;
        }

        .bg-ambient .orb:nth-child(1) {
            width: 600px;
            height: 600px;
            background: #a855f7;
            top: -10%;
            left: -5%;
            animation-duration: 25s;
        }

        .bg-ambient .orb:nth-child(2) {
            width: 500px;
            height: 500px;
            background: #ff007f;
            bottom: -10%;
            right: -5%;
            animation-duration: 30s;
            animation-delay: -5s;
        }

        .bg-ambient .orb:nth-child(3) {
            width: 300px;
            height: 300px;
            background: #ff4500;
            top: 40%;
            right: 20%;
            animation-duration: 18s;
            animation-delay: -10s;
            opacity: 0.15;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -40px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }

            100% {
                transform: translate(10px, -10px) scale(1.05);
            }
        }

        /* 微妙的噪点纹理 */
        .bg-ambient::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.09'/%3E%3C/svg%3E");
            opacity: 0.3;
            mix-blend-mode: overlay;
        }

        /* ========== 主容器 ========== */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
        }

        /* ========== 顶部标题栏 ========== */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-panel);
            backdrop-filter: blur(32px) saturate(1.2);
            -webkit-backdrop-filter: blur(32px) saturate(1.2);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-md);
            padding: 10px 24px;
            box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.09);
            flex-shrink: 0;
        }

        .top-bar .logo-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-bar .logo-icon {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            background: var(--gradient-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 8px 24px rgba(168, 85, 247, 0.30);
            flex-shrink: 0;
        }

        .top-bar h1 {
            font-size: 1.3rem;
            font-weight: 900;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .top-bar .subtitle {
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.3px;
            margin-left: 6px;
        }

        /* ========== 主内容区 ========== */
        .main-content {
            display: flex;
            flex-direction: row;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }

        /* ========== 侧边栏（左侧）- 缩小版 ========== */
        .sidebar {
            width: 260px;
            min-width: 200px;
            height: 100%;
            background: var(--bg-panel);
            backdrop-filter: blur(32px) saturate(1.2);
            -webkit-backdrop-filter: blur(32px) saturate(1.2);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-lg);
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.09);
            overflow-y: auto;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
            transition: var(--transition-smooth);
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.3);
            border-radius: 10px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(168, 85, 247, 0.25), transparent);
            margin: 2px 0;
        }

        /* ========== 输入组（紧凑） ========== */
        .inputs-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-label .badge {
            font-size: 0.55rem;
            font-weight: 600;
            background: rgba(168, 85, 247, 0.15);
            color: var(--accent-1);
            padding: 1px 8px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }

        .number-stepper {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-sm);
            overflow: hidden;
            transition: var(--transition-smooth);
            backdrop-filter: blur(4px);
        }

        .number-stepper:focus-within {
            border-color: var(--accent-1);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15), 0 0 20px rgba(168, 85, 247, 0.05);
        }

        .number-stepper:hover {
            border-color: rgba(168, 85, 247, 0.30);
        }

        .stepper-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 32px;
            height: 36px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
            font-weight: 300;
            user-select: none;
        }

        .stepper-btn:hover {
            background: rgba(168, 85, 247, 0.10);
            color: var(--accent-1);
        }

        .stepper-btn:active {
            transform: scale(0.88);
        }

        .stepper-input {
            width: 100%;
            height: 36px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            text-align: center;
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            outline: none;
            min-width: 30px;
        }

        .stepper-input::-webkit-outer-spin-button,
        .stepper-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .stepper-input[type=number] {
            -moz-appearance: textfield;
        }

        /* ========== 按钮组（紧凑） ========== */
        .buttons-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 2px;
        }

        .btn {
            width: 100%;
            border: none;
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition-smooth);
            font-family: 'Noto Sans SC', 'Outfit', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            opacity: 0;
            transition: opacity 0.4s;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.09), transparent 60%);
            pointer-events: none;
        }

        .btn:hover::after {
            opacity: 1;
        }

        .btn-play {
            background: var(--gradient-main);
            color: #fff;
            box-shadow: 0 4px 24px var(--glow-purple);
        }

        .btn-play:hover {
            background: var(--gradient-hover);
            box-shadow: 0 8px 40px rgba(168, 85, 247, 0.50);
            transform: translateY(-2px) scale(1.01);
        }

        .btn-play:active {
            transform: translateY(1px) scale(0.98);
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
        }

        .btn-clear:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 51, 68, 0.30);
            color: #ff3344;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(255, 51, 68, 0.09);
        }

        .btn-clear:active {
            transform: translateY(1px);
        }

        .btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* ========== 画布容器 ========== */
        .canvas-wrapper {
            flex: 1;
            height: 100%;
            background: rgba(6, 7, 14, 0.50);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: var(--radius-lg);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-card), inset 0 0 80px rgba(168, 85, 247, 0.02);
            backdrop-filter: blur(4px);
        }

        .canvas-wrapper canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: var(--radius-lg);
        }

        /* ========== HUD 面板（放大） ========== */
        .hud-row {
            position: absolute;
            top: 16px;
            left: 22px;
            right: 22px;
            height: clamp(130px, 22vh, 160px);
            display: flex;
            gap: 18px;
            z-index: 20;
            pointer-events: none;
        }

        .hud-panel {
            flex: 1;
            background: rgba(10, 12, 24, 0.75);
            backdrop-filter: blur(20px) saturate(1.2);
            -webkit-backdrop-filter: blur(20px) saturate(1.2);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: var(--radius-md);
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            gap: 6px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-16px) scale(0.96);
            transition: opacity 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                border-color 0.4s,
                box-shadow 0.4s,
                background 0.4s;
        }

        .hud-panel.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .hud-panel.formula-panel.active {
            border-color: rgba(168, 85, 247, 0.45);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55), 0 0 35px rgba(168, 85, 247, 0.14);
            background: rgba(12, 14, 28, 0.88);
        }

        /* 余数面板：禁用模糊滤镜，上部半透以保证文字清晰，下部小棒区域完全透明，绝不遮挡小棒亮度 */
        .hud-panel.remainder-panel {
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            background: linear-gradient(180deg, rgba(14, 16, 32, 0.85) 0%, rgba(14, 16, 32, 0.40) 45%, rgba(14, 16, 32, 0.0) 80%);
            border-color: rgba(255, 255, 255, 0.10);
        }

        .hud-panel.remainder-panel.active {
            border-color: rgba(255, 45, 100, 0.55);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45), 0 0 40px rgba(255, 45, 100, 0.22), inset 0 0 25px rgba(255, 45, 100, 0.06);
            background: linear-gradient(180deg, rgba(16, 18, 38, 0.88) 0%, rgba(16, 18, 38, 0.42) 45%, rgba(16, 18, 38, 0.0) 80%);
        }

        .hud-label {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud-label .badge {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
            text-transform: none;
            letter-spacing: 0;
        }

        .formula-panel .badge {
            background: rgba(168, 85, 247, 0.2);
            color: #d8b4fe;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .remainder-panel .badge {
            background: rgba(244, 63, 94, 0.2);
            color: #fda4af;
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        .formula-math {
            font-size: clamp(2.0rem, 3.2vw, 2.9rem);
            font-weight: 900;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            line-height: 1.22;
            filter: drop-shadow(0 2px 16px rgba(255, 0, 127, 0.20));
            letter-spacing: 0.5px;
        }

        /* 余数部分：与商完全一致的字体大小、颜色、粗细、渐变 */
        .formula-math .rem {
            font-size: inherit;
            font-weight: 900;
            background: linear-gradient(90deg, #ff007f, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .formula-text {
            color: var(--text-secondary);
            font-size: clamp(0.92rem, 1.25vw, 1.15rem);
            font-weight: 500;
            text-align: center;
            line-height: 1.35;
        }

        .remainder-text {
            color: var(--text-secondary);
            font-size: clamp(0.92rem, 1.25vw, 1.15rem);
            font-weight: 500;
            text-align: center;
            line-height: 1.35;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 820px) {
            .container {
                padding: 12px;
                gap: 10px;
            }

            .top-bar {
                padding: 10px 16px;
                border-radius: var(--radius-sm);
            }

            .top-bar h1 {
                font-size: 1.1rem;
            }

            .top-bar .logo-icon {
                width: 28px;
                height: 28px;
                font-size: 13px;
            }

            .top-bar .subtitle {
                font-size: 0.65rem;
            }

            .main-content {
                flex-direction: column;
                flex: 1;
                min-height: 0;
            }

            .sidebar {
                width: 100%;
                min-width: unset;
                height: auto;
                padding: 16px 14px;
                gap: 10px;
                border-radius: var(--radius-md);
                order: 2;
                flex-shrink: 0;
                max-height: 280px;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
            }

            .sidebar .inputs-group {
                flex: 1;
                flex-direction: row;
                gap: 12px;
                min-width: 200px;
            }

            .sidebar .input-item {
                flex: 1;
            }

            .sidebar .buttons-group {
                flex-direction: row;
                gap: 8px;
                flex: 1;
                min-width: 160px;
            }

            .sidebar .btn {
                flex: 1;
                padding: 8px 12px;
                font-size: 0.7rem;
            }

            .sidebar .divider {
                display: none;
            }

            .canvas-wrapper {
                width: 100%;
                height: 340px;
                min-height: 220px;
                flex-shrink: 0;
                order: 1;
                border-radius: var(--radius-md);
            }

            .canvas-wrapper canvas {
                border-radius: var(--radius-md);
            }

            .hud-row {
                top: 10px;
                left: 10px;
                right: 10px;
                height: 110px;
                gap: 10px;
            }

            .hud-panel {
                padding: 10px 12px;
                border-radius: var(--radius-sm);
            }

            .hud-label {
                font-size: 0.6rem;
                letter-spacing: 1.2px;
            }

            .formula-math {
                font-size: 1.6rem;
            }

            .formula-math .rem {
                font-size: 1.6rem;
            }

            .formula-text {
                font-size: 0.8rem;
            }

            .remainder-text {
                font-size: 0.82rem;
            }

            .remainder-matches {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 8px;
                gap: 8px;
            }

            .top-bar {
                padding: 8px 12px;
            }

            .top-bar h1 {
                font-size: 0.95rem;
            }

            .top-bar .logo-icon {
                width: 24px;
                height: 24px;
                font-size: 11px;
            }

            .top-bar .subtitle {
                font-size: 0.55rem;
            }

            .sidebar {
                padding: 12px 10px;
                gap: 8px;
                max-height: 240px;
                flex-direction: column;
            }

            .sidebar .inputs-group {
                flex-direction: column;
                gap: 8px;
                min-width: unset;
                width: 100%;
            }

            .sidebar .buttons-group {
                flex-direction: column;
                gap: 6px;
                min-width: unset;
                width: 100%;
            }

            .canvas-wrapper {
                height: 200px;
                min-height: 150px;
            }

            .hud-row {
                top: 8px;
                left: 8px;
                right: 8px;
                height: 60px;
                gap: 8px;
            }

            .hud-panel {
                padding: 6px 10px;
            }

            .formula-math {
                font-size: 1.0rem;
            }

            .formula-math .rem {
                font-size: 1.0rem;
            }

            .stepper-btn {
                width: 28px;
                height: 30px;
                font-size: 0.85rem;
            }

            .stepper-input {
                height: 30px;
                font-size: 0.8rem;
            }

            .btn {
                padding: 8px 10px;
                font-size: 0.7rem;
            }

            .btn svg {
                width: 13px;
                height: 13px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== 动态背景 ===== -->
    <div class="bg-ambient">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- ===== 主容器 ===== -->
    <div class="container">

        <!-- ===== 顶部标题栏 ===== -->
        <header class="top-bar">
            <div class="logo-row">
                <div class="logo-icon">⊞</div>
                <h1>小棒拼图形</h1>
                <span class="subtitle">数学除法 · 动画可视化</span>
            </div>
            <div style="flex:1;"></div>
        </header>

        <!-- ===== 主内容区 ===== -->
        <div class="main-content">

            <!-- ===== 侧边栏 (左侧) - 缩小 ===== -->
            <aside class="sidebar">
                <div class="inputs-group">
                    <div class="input-item">
                        <span class="input-label">
                            总数
                            <span class="badge">Total</span>
                        </span>
                        <div class="number-stepper">
                            <button class="stepper-btn" onclick="adjustValue('totalInput', -1)">−</button>
                            <input type="number" id="totalInput" class="stepper-input" value="20" min="1" max="500"
                                oninput="onInputChange()" onchange="onInputChange()">
                            <button class="stepper-btn" onclick="adjustValue('totalInput', 1)">+</button>
                        </div>
                    </div>

                    <div class="input-item">
                        <span class="input-label" id="sidesLabel">
                            单图形
                            <span class="badge">Shape</span>
                        </span>
                        <div class="number-stepper">
                            <button class="stepper-btn" onclick="adjustValue('sidesInput', -1)">−</button>
                            <input type="number" id="sidesInput" class="stepper-input" value="5" min="3" max="20"
                                oninput="onInputChange()" onchange="onInputChange()">
                            <button class="stepper-btn" onclick="adjustValue('sidesInput', 1)">+</button>
                        </div>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="buttons-group">
                    <button class="btn btn-play" onclick="onPlay()">
                        <svg viewBox="0 0 24 24">
                            <path d="M8,5.14V19.14L19,12.14L8,5.14Z" />
                        </svg>
                        播放
                    </button>
                    <button class="btn btn-clear" onclick="onReset()">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M19.36 2.72L20.78 4.14L15.06 9.86L16.48 11.28L22.2 1.56L23.62 2.98L17.9 8.7L19.32 10.09L13.6 15.84C12.82 16.62 11.56 16.62 10.78 15.84L2.3 7.36C1.52 6.58 1.52 5.32 2.3 4.54L8.02 10.26L9.44 8.84L3.72 3.12L5.14 1.7L10.86 7.42L12.28 6L6.56 0.28L7.98 1.14L13.7 6.86L19.36 2.72M3 18H21V20H3V18Z" />
                        </svg>
                        重置
                    </button>
                </div>
            </aside>

            <!-- ===== 画布 ===== -->
            <div class="canvas-wrapper">
                <!-- HUD 行（放大） -->
                <div class="hud-row">
                    <div id="formulaDisplay" class="hud-panel formula-panel">
                        <div class="hud-label">
                            <span>除法算式 · 计算结果</span>
                            <span class="badge">Formula</span>
                        </div>
                        <div id="formulaMath" class="formula-math">− ÷ − = −</div>
                        <div id="formulaText" class="formula-text"> </div>
                    </div>
                    <div id="remainderDisplay" class="hud-panel remainder-panel">
                        <div class="hud-label">
                            <span>余数展示区</span>
                            <span id="remainderBadge" class="badge">余数</span>
                        </div>
                        <div id="remainderText" class="remainder-text">无余数</div>
                        <div id="remainderMatches" class="remainder-matches" style="display:none;"></div>
                    </div>
                </div>

                <canvas id="animationCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        // ========================================================================
        //  JavaScript — 核心逻辑（高性能 & Delta Time 驱动重构版）
        // ========================================================================

        const canvas = document.getElementById('animationCanvas');
        const ctx = canvas.getContext('2d');

        // 教学大屏/低配核显优化：DPR 严格限制为最大 1.0，防止 4K 分辨率下生成数千万像素的巨大 Canvas 压垮核显
        let dpr = Math.min(window.devicePixelRatio || 1, 1.0);

        // --- 渐变缓存 (火柴杆) ---
        let shaftGradientCache = null;
        let shaftGradientCacheRem = null;

        function getShaftGradient(ctx, len, isRemainder = false) {
            if (isRemainder) {
                if (!shaftGradientCacheRem) {
                    shaftGradientCacheRem = ctx.createLinearGradient(-30, 0, 30, 0);
                    shaftGradientCacheRem.addColorStop(0, '#ff1a53');
                    shaftGradientCacheRem.addColorStop(0.2, '#ff477e');
                    shaftGradientCacheRem.addColorStop(0.5, '#ffa2b8'); // 高亮发光中心
                    shaftGradientCacheRem.addColorStop(0.8, '#ff477e');
                    shaftGradientCacheRem.addColorStop(1, '#ff1a53');
                }
                return shaftGradientCacheRem;
            }
            if (!shaftGradientCache) {
                shaftGradientCache = ctx.createLinearGradient(-30, 0, 30, 0);
                shaftGradientCache.addColorStop(0, '#d91b42');
                shaftGradientCache.addColorStop(0.25, '#ff2a6d');
                shaftGradientCache.addColorStop(0.5, '#ff6e8d');
                shaftGradientCache.addColorStop(0.75, '#ff2a6d');
                shaftGradientCache.addColorStop(1, '#d91b42');
            }
            return shaftGradientCache;
        }

        function resizeCanvas() {
            dpr = Math.min(window.devicePixelRatio || 1, 1.0);
            const rect = canvas.getBoundingClientRect();
            canvas.width = Math.round(rect.width * dpr);
            canvas.height = Math.round(rect.height * dpr);
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }

        // --- 火柴实体 ---
        class Matchstick {
            constructor(id, startX, startY, startAngle) {
                this.id = id;
                this.x = startX;
                this.y = startY;
                this.angle = startAngle;
                this.tx = startX;
                this.ty = startY;
                this.tAngle = startAngle;
                this.length = 52;
                this.tLength = 52;
                this.thickness = 3.5;
                this.delay = 0; // 改为真实秒数（seconds）
                this.isRemainder = false; // 是否属于余数区高亮小棒
                this.headOffset = 0;
            }

            // Delta Time 真实物理时间驱动
            update(dt) {
                if (this.delay > 0) {
                    this.delay -= dt;
                    if (this.delay > 0) return;
                }

                // 在原速度上提速 40%：衰减系数调整为 5.0（耗时约 0.8~1.0 秒），节奏灵动流畅、恰到好处
                const factor = 1 - Math.exp(-5.0 * dt);

                this.x += (this.tx - this.x) * factor;
                this.y += (this.ty - this.y) * factor;

                let diff = this.tAngle - this.angle;
                diff = Math.atan2(Math.sin(diff), Math.cos(diff));
                this.angle += diff * factor;

                this.length += (this.tLength - this.length) * factor;

                // 微小距离吸附，避免微小残留浮点计算抖动
                if (Math.abs(this.tx - this.x) < 0.08 && Math.abs(this.ty - this.y) < 0.08) {
                    this.x = this.tx;
                    this.y = this.ty;
                }
                if (Math.abs(diff) < 0.002) {
                    this.angle = this.tAngle;
                }
                if (Math.abs(this.tLength - this.length) < 0.08) {
                    this.length = this.tLength;
                }
            }

            draw(ctx) {
                const len = this.length;
                const half = len / 2;
                const isRem = this.isRemainder;
                // 余数小棒加粗至 5.4px，普通小棒适度加粗（3.8px）
                const thick = isRem ? 5.4 : Math.max(2.2, 3.8 * (len / 52));

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // ---- 性能核心优化：普通小棒禁用昂贵的 shadowBlur；余数小棒从 16~20 降至 6~8 ----
                if (isRem) {
                    ctx.shadowColor = 'rgba(255, 30, 85, 0.85)';
                    ctx.shadowBlur = 6;
                } else {
                    ctx.shadowBlur = 0;
                }

                // ---- 火柴杆主体 ----
                const grad = getShaftGradient(ctx, len, isRem);
                ctx.strokeStyle = grad;
                ctx.lineWidth = thick;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-half, 0);
                ctx.lineTo(half, 0);
                ctx.stroke();

                // ---- 余数火柴杆中心高亮芯线 ----
                if (isRem) {
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(255, 240, 245, 0.92)';
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.moveTo(-half + 3, 0);
                    ctx.lineTo(half - thick * 1.5, 0);
                    ctx.stroke();
                }

                // ---- 火柴头 (高亮度发光圆头) ----
                const headRadius = isRem ? Math.max(4.6, thick * 1.45) : Math.max(3.2, thick * 1.3);
                const headX = half - 1;

                if (isRem) {
                    ctx.shadowColor = 'rgba(255, 50, 100, 0.90)';
                    ctx.shadowBlur = 8;
                } else {
                    ctx.shadowBlur = 0;
                }

                const gradHead = ctx.createRadialGradient(
                    headX - headRadius * 0.25, -headRadius * 0.2, headRadius * 0.09,
                    headX, 0, headRadius
                );

                if (isRem) {
                    gradHead.addColorStop(0, '#ffffff'); // 超强白热高光核
                    gradHead.addColorStop(0.25, '#ffb8cb');
                    gradHead.addColorStop(0.65, '#ff1a53');
                    gradHead.addColorStop(1, '#c50030');
                } else {
                    gradHead.addColorStop(0, '#ffe0e6');
                    gradHead.addColorStop(0.35, '#ff477e');
                    gradHead.addColorStop(0.75, '#e11d48');
                    gradHead.addColorStop(1, '#991b3c');
                }

                ctx.fillStyle = gradHead;
                ctx.beginPath();
                ctx.arc(headX, 0, headRadius, 0, Math.PI * 2);
                ctx.fill();

                // 火柴头顶高光反光点
                ctx.shadowBlur = 0;
                const hl = ctx.createRadialGradient(
                    headX - headRadius * 0.35, -headRadius * 0.35, headRadius * 0.09,
                    headX - headRadius * 0.1, -headRadius * 0.1, headRadius * 0.55
                );
                hl.addColorStop(0, 'rgba(255,255,255,0.85)');
                hl.addColorStop(0.6, 'rgba(255,255,255,0.15)');
                hl.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = hl;
                ctx.beginPath();
                ctx.arc(headX, 0, headRadius, 0, Math.PI * 2);
                ctx.fill();

                // ---- 杆身微光泽 ----
                if (!isRem) {
                    const hl2 = ctx.createLinearGradient(-half, -thick / 2, -half, thick / 2);
                    hl2.addColorStop(0, 'rgba(255,255,255,0.06)');
                    hl2.addColorStop(0.4, 'rgba(255,255,255,0)');
                    hl2.addColorStop(0.6, 'rgba(255,255,255,0)');
                    hl2.addColorStop(1, 'rgba(255,255,255,0.09)');
                    ctx.fillStyle = hl2;
                    ctx.fillRect(-half, -thick / 2, len, thick);
                }

                ctx.restore();
            }
        }

        // --- 全局状态 ---
        let matchsticks = [];
        let totalCount = 20;
        let polygonSides = 5;
        let isAssembled = false;

        // --- 辅助函数 ---
        function getRackMatchstickLength(count) {
            if (count <= 40) return 52;
            if (count <= 100) return 40;
            if (count <= 250) return 30;
            return 20;
        }

        function getRackPosition(i, count, canvasWidth, canvasHeight) {
            const padding = 30;
            let maxPerRow = 15,
                rowSpacing = 65;
            if (count > 40 && count <= 100) {
                maxPerRow = 20;
                rowSpacing = 52;
            } else if (count > 100 && count <= 250) {
                maxPerRow = 30;
                rowSpacing = 40;
            } else if (count > 250) {
                maxPerRow = 45;
                rowSpacing = 28;
            }

            const rowIndex = Math.floor(i / maxPerRow);
            const colIndex = i % maxPerRow;
            const matchInThisRow = Math.min(maxPerRow, count - rowIndex * maxPerRow);
            const totalRows = Math.ceil(count / maxPerRow);
            const rackYBase = canvasHeight - 50 - (totalRows - 1) * rowSpacing;

            let x = padding;
            if (matchInThisRow > 1) {
                const rowWidth = canvasWidth - padding * 2;
                const spacing = Math.min(45, rowWidth / (matchInThisRow - 1));
                const totalRowWidth = spacing * (matchInThisRow - 1);
                const rowStartX = (canvasWidth - totalRowWidth) / 2;
                x = rowStartX + colIndex * spacing;
            } else {
                x = canvasWidth / 2;
            }
            const y = rackYBase + rowIndex * rowSpacing;
            return { x, y };
        }

        function initMatchsticks(count) {
            matchsticks = [];
            const w = canvas.width / dpr,
                h = canvas.height / dpr;
            const defaultLen = getRackMatchstickLength(count);
            for (let i = 0; i < count; i++) {
                const pos = getRackPosition(i, count, w, h);
                const m = new Matchstick(i, pos.x, pos.y, -Math.PI / 2);
                m.length = defaultLen;
                m.tLength = defaultLen;
                matchsticks.push(m);
            }
            isAssembled = false;
            const shapeCount = Math.floor(totalCount / polygonSides);
            const remainder = totalCount % polygonSides;
            updateFormulaDisplay(totalCount, polygonSides, shapeCount, remainder, false);
        }

        function validateInputs() {
            const totalEl = document.getElementById('totalInput');
            const sidesEl = document.getElementById('sidesInput');
            let total = parseInt(totalEl.value) || 20;
            let sides = parseInt(sidesEl.value) || 5;
            let clampedTotal = Math.min(500, Math.max(1, total));
            let clampedSides = Math.min(20, Math.max(3, sides));
            if (totalEl.value !== '' && parseInt(totalEl.value) !== clampedTotal) totalEl.value = clampedTotal;
            if (sidesEl.value !== '' && parseInt(sidesEl.value) !== clampedSides) sidesEl.value = clampedSides;
            const labelEl = document.getElementById('sidesLabel');
            if (labelEl) {
                const name = `${clampedSides}边形`;
                labelEl.innerHTML = `单图形 <span class="badge">${name}</span>`;
            }
            return { total: clampedTotal, sides: clampedSides };
        }

        function onInputChange(autoAssemble = true) {
            const config = validateInputs();
            totalCount = config.total;
            polygonSides = config.sides;

            // 彻底解决半空冻结与残留：清零所有小棒残留的延迟，解除定格状态
            for (let i = 0; i < matchsticks.length; i++) {
                matchsticks[i].delay = 0;
            }

            if (autoAssemble) {
                isAssembled = true;
            }
            // 实时参数微调模式（isPlayMode = false）：无多余阶梯等待，全员立即平滑重组
            syncMatchstickCount(false);
        }

        function adjustValue(inputId, delta) {
            const el = document.getElementById(inputId);
            let val = parseInt(el.value) || 0;
            el.value = val + delta;
            // 调整参数自动排布
            onInputChange(true);
        }

        function syncMatchstickCount(isPlayMode = false) {
            const w = canvas.width / dpr,
                h = canvas.height / dpr;
            const defaultLen = getRackMatchstickLength(totalCount);

            if (matchsticks.length < totalCount) {
                const startIdx = matchsticks.length;
                for (let i = startIdx; i < totalCount; i++) {
                    const pos = getRackPosition(i, totalCount, w, h);
                    const m = new Matchstick(i, pos.x, pos.y, -Math.PI / 2);
                    m.length = defaultLen;
                    m.tx = pos.x;
                    m.ty = pos.y;
                    m.tAngle = -Math.PI / 2;
                    m.tLength = defaultLen;
                    m.delay = 0;
                    matchsticks.push(m);
                }
            } else if (matchsticks.length > totalCount) {
                matchsticks.length = totalCount;
            }

            if (isAssembled) {
                calculateTargetPositions(isPlayMode);
            } else {
                for (let i = 0; i < matchsticks.length; i++) {
                    const pos = getRackPosition(i, totalCount, w, h);
                    const m = matchsticks[i];
                    m.tx = pos.x;
                    m.ty = pos.y;
                    m.tAngle = -Math.PI / 2;
                    m.tLength = defaultLen;
                    m.delay = 0;
                }
                const shapeCount = Math.floor(totalCount / polygonSides);
                const remainder = totalCount % polygonSides;
                updateFormulaDisplay(totalCount, polygonSides, shapeCount, remainder, false);
            }
        }

        // --- 核心：计算目标位置 ---
        // isPlayMode: true 表示从底座开始的整场演示播放（带阶梯延迟）；false 表示参数快速切换（全员平滑重组，无延迟冻结）
        function calculateTargetPositions(isPlayMode = false) {
            const w = canvas.width / dpr,
                h = canvas.height / dpr;
            const shapeCount = Math.floor(totalCount / polygonSides);
            const remainder = totalCount % polygonSides;

            // 动态测量余数面板在 Canvas 内的精确物理坐标
            const remainderPanel = document.getElementById('remainderDisplay');
            const canvasRect = canvas.getBoundingClientRect();
            let rxStart, ryStart, panelW, hudHeight;

            if (remainderPanel && canvasRect) {
                const rRect = remainderPanel.getBoundingClientRect();
                rxStart = rRect.left - canvasRect.left;
                ryStart = rRect.top - canvasRect.top;
                panelW = rRect.width;
                hudHeight = rRect.height;
            } else {
                hudHeight = Math.min(150, Math.max(110, h * 0.22));
                panelW = (w - 60) / 2;
                rxStart = 30 + panelW + 20;
                ryStart = 16;
            }

            const isMobile = w <= 650;
            const L = isMobile ? 14 : 32;
            const R = w - (isMobile ? 14 : 32);
            const T = Math.max(ryStart + hudHeight + 20, isMobile ? 120 : 180);
            const B = h - (isMobile ? 16 : 36);
            const W = Math.max(100, R - L),
                H = Math.max(100, B - T);

            let cols = 4;
            if (shapeCount > 8) cols = 6;
            if (shapeCount > 24) cols = 10;
            if (shapeCount > 60) cols = 15;
            if (shapeCount > 120) cols = 20;
            if (cols > shapeCount) cols = shapeCount;
            if (cols < 1) cols = 1;
            const rows = Math.ceil(shapeCount / cols);
            const activeCols = Math.min(shapeCount, cols);

            const maxL = 120,
                minL = 12;
            const sinVal = Math.sin(Math.PI / polygonSides);
            const maxR = maxL / (2 * sinVal);
            const minR = minL / (2 * sinVal);
            const k = 2.3;
            const limitR_h = activeCols > 1 ? W / ((activeCols - 1) * k + 2) : W / 2;
            const limitR_v = rows > 1 ? H / ((rows - 1) * k + 2) : H / 2;
            const limitR = Math.min(limitR_h, limitR_v);
            const R_poly = Math.max(minR, Math.min(maxR, limitR));
            const targetLength = R_poly * 2 * sinVal;

            const cellW = activeCols > 1 ? (W - 2 * R_poly) / (activeCols - 1) : 0;
            const cellH = rows > 1 ? (H - 2 * R_poly) / (rows - 1) : 0;

            // 拼接节奏提速 40%：图形逐个拼出的节奏更加轻快流畅
            // 图形少时每个图形间隔约 0.28~0.32 秒，图形多时自适应保持在 0.10~0.18 秒
            const shapeDelaySec = isPlayMode ?
                Math.max(0.08, Math.min(0.32, 1.85 / Math.max(1, shapeCount))) :
                (shapeCount > 1 ? 0.02 : 0);
            // 每条边依次落位围合的轻微时间差
            const edgeDelaySec = isPlayMode ? Math.min(0.032, 0.15 / Math.max(1, polygonSides)) : 0.003;

            for (let s = 0; s < shapeCount; s++) {
                const r = Math.floor(s / cols);
                const c = s % cols;
                let cx = activeCols > 1 ? L + R_poly + c * cellW : L + W / 2;
                let cy = rows > 1 ? T + R_poly + r * cellH : T + H / 2;
                const baseAngle = -Math.PI / 2;
                const verts = [];
                for (let v = 0; v <= polygonSides; v++) {
                    const theta = baseAngle + (2 * Math.PI * v) / polygonSides;
                    verts.push({ x: cx + R_poly * Math.cos(theta), y: cy + R_poly * Math.sin(theta) });
                }
                for (let e = 0; e < polygonSides; e++) {
                    const midx = s * polygonSides + e;
                    if (midx < matchsticks.length) {
                        const m = matchsticks[midx];
                        const p1 = verts[e],
                            p2 = verts[e + 1];
                        m.isRemainder = false;
                        m.tx = (p1.x + p2.x) / 2;
                        m.ty = (p1.y + p2.y) / 2;
                        m.tAngle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
                        m.tLength = targetLength;
                        // 播放模式逐个图形分步拼出；参数调节模式平滑微波纹滑动
                        m.delay = s * shapeDelaySec + e * edgeDelaySec;
                    }
                }
            }

            // 余数区目标位置：在所有完整图形拼出后，余数小棒依次优雅滑入右上角余数框
            const remStickLen = Math.min(52, Math.max(32, hudHeight * 0.40));
            const remStartY = ryStart + hudHeight * 0.65;
            const maxRemWidth = Math.min(panelW - 44, Math.max(40, remainder * 34));
            const spacing = remainder > 1 ? Math.min(32, Math.max(12, maxRemWidth / (remainder - 1))) : 0;
            const totalRemSpacing = spacing * (remainder - 1);
            const remStartX = rxStart + (panelW - totalRemSpacing) / 2;
            const remBaseDelaySec = isPlayMode ? (shapeCount * shapeDelaySec + 0.11) : 0.04;
            const remEdgeDelaySec = isPlayMode ? 0.06 : 0.01;

            for (let i = 0; i < remainder; i++) {
                const midx = shapeCount * polygonSides + i;
                if (midx < matchsticks.length) {
                    const m = matchsticks[midx];
                    m.isRemainder = true;
                    m.tx = remStartX + i * spacing;
                    m.ty = remStartY;
                    m.tAngle = -Math.PI / 2;
                    m.tLength = remStickLen;
                    m.delay = remBaseDelaySec + i * remEdgeDelaySec;
                }
            }

            updateFormulaDisplay(totalCount, polygonSides, shapeCount, remainder, true);
        }

        // --- 更新 UI ---
        function updateRemainderDisplay(remainder, isAssembled) {
            const display = document.getElementById('remainderDisplay');
            const text = document.getElementById('remainderText');
            const badge = document.getElementById('remainderBadge');
            const container = document.getElementById('remainderMatches');
            if (container) container.innerHTML = '';
            if (!display || !text) return;

            if (isAssembled) {
                display.classList.add('show');
                if (remainder > 0) {
                    display.classList.add('active');
                    if (badge) badge.innerText = `${remainder} 根余数`;
                    text.innerHTML = `多余 <span style="color:#ff007f;font-weight:900;font-size:1.15em;">${remainder}</span> 根小棒 · 无法再拼成完整图形`;
                } else {
                    display.classList.remove('active');
                    if (badge) badge.innerText = '刚好拼完';
                    text.innerHTML = '<span style="color:#10b981;font-weight:700;">✓ 刚好用完 · 无余数</span>';
                }
            } else {
                display.classList.remove('show');
                display.classList.remove('active');
                if (badge) badge.innerText = '余数';
                text.innerText = '调整参数或点击 + 自动摆小棒';
            }
        }

        function updateFormulaDisplay(total, sides, quotient, rem, isAssembled) {
            const mathEl = document.getElementById('formulaMath');
            const textEl = document.getElementById('formulaText');
            const display = document.getElementById('formulaDisplay');
            if (!mathEl || !textEl || !display) return;

            mathEl.innerHTML =
                `${total} ÷ ${sides} = ${quotient} ${rem > 0 ? `<span class="rem">······ ${rem}</span>` : ''}`;

            if (isAssembled) {
                display.classList.add('show');
                display.classList.add('active');
            } else {
                display.classList.remove('show');
                display.classList.remove('active');
            }
            updateRemainderDisplay(rem, isAssembled);
        }

        // --- 真实时间驱动的动画主循环 ---
        let lastTime = 0;
        function animate(currentTime) {
            if (!lastTime) lastTime = currentTime;
            let dt = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            // 限制单帧最大时间为 0.1s，避免在切换标签页、息屏唤醒或偶发卡顿时突变乱跳
            if (dt > 0.1) dt = 0.1;
            if (dt < 0) dt = 0;

            ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
            for (let i = 0; i < matchsticks.length; i++) {
                matchsticks[i].update(dt);
                matchsticks[i].draw(ctx);
            }
            requestAnimationFrame(animate);
        }

        // --- 控制 ---
        function onPlay() {
            const config = validateInputs();
            totalCount = config.total;
            polygonSides = config.sides;
            const w = canvas.width / dpr,
                h = canvas.height / dpr;
            const defaultLen = getRackMatchstickLength(totalCount);

            // 播放时：从底部支架重新以优雅平滑的步调摆出
            for (let i = 0; i < matchsticks.length; i++) {
                const pos = getRackPosition(i, totalCount, w, h);
                const m = matchsticks[i];
                m.x = pos.x;
                m.y = pos.y;
                m.angle = -Math.PI / 2;
                m.length = defaultLen;
                m.delay = 0;
            }
            isAssembled = true;
            calculateTargetPositions(true); // 演示模式：带优雅阶梯时间
        }

        function onReset() {
            isAssembled = false;
            const config = validateInputs();
            totalCount = config.total;
            polygonSides = config.sides;
            const w = canvas.width / dpr,
                h = canvas.height / dpr;
            const defaultLen = getRackMatchstickLength(totalCount);
            for (let i = 0; i < matchsticks.length; i++) {
                const pos = getRackPosition(i, totalCount, w, h);
                const m = matchsticks[i];
                m.isRemainder = false;
                m.tx = pos.x;
                m.ty = pos.y;
                m.tAngle = -Math.PI / 2;
                m.tLength = defaultLen;
                m.delay = 0;
            }
            const shapeCount = Math.floor(totalCount / polygonSides);
            const remainder = totalCount % polygonSides;
            updateFormulaDisplay(totalCount, polygonSides, shapeCount, remainder, false);
        }

        // --- 生命周期 ---
        window.addEventListener('resize', () => {
            resizeCanvas();
            if (isAssembled) calculateTargetPositions(false);
            else initMatchsticks(totalCount);
        });

        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            const config = validateInputs();
            totalCount = config.total;
            polygonSides = config.sides;
            initMatchsticks(totalCount);
            requestAnimationFrame(animate);
            // 页面加载后自动平滑摆好
            setTimeout(() => {
                isAssembled = true;
                calculateTargetPositions(true);
            }, 100);
        });

        // 暴露全局给 HTML onclick
        window.adjustValue = adjustValue;
        window.onInputChange = onInputChange;
        window.onPlay = onPlay;
        window.onReset = onReset;
    </script>

</body>

</html>
