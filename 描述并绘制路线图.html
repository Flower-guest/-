    <!-- AUDIO SYNTHESIZER FOR CLICK/REVEAL (BROWSER NATIVE) -->
    <script>
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'reveal') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'hide') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.setValueAtTime(880, now + 0.1);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch (e) {
                // Audio fallback silence
            }
        }
    </script>

        // ==========================================
        // CANVAS ZOOM & PAN CONTROLLER
        // ==========================================
        let zoomScale = 1.0;
        let panX = 0;
        let panY = 0;
        let isDraggingCanvas = false;
        let dragStartX = 0;
        let dragStartY = 0;

        function updateZoomTransform() {
            const zoomGroup = document.getElementById('svg-zoom-group');
            if (zoomGroup) {
                zoomGroup.setAttribute('transform', `translate(${panX}, ${panY}) scale(${zoomScale})`);
            }
            const zoomLabel = document.getElementById('label-zoom-percent');
            if (zoomLabel) {
                zoomLabel.textContent = `${Math.round(zoomScale * 100)}%`;
            }
        }

        function zoomIn() {
            playSound('click');
            zoomScale = Math.min(2.5, Math.round((zoomScale + 0.15) * 100) / 100);
            updateZoomTransform();
        }

        function zoomOut() {
            playSound('click');
            zoomScale = Math.max(0.5, Math.round((zoomScale - 0.15) * 100) / 100);
            updateZoomTransform();
        }

        function resetZoom() {
            zoomScale = 1.0;
            panX = 0;
            panY = 0;
            updateZoomTransform();
        }

        function initZoomPanEvents() {
            const viewport = document.getElementById('svg-viewport');
            if (!viewport) return;

            viewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY < 0 ? 0.1 : -0.1;
                zoomScale = Math.max(0.5, Math.min(2.5, Math.round((zoomScale + delta) * 100) / 100));
                updateZoomTransform();
            }, { passive: false });

            viewport.addEventListener('mousedown', (e) => {
                if (e.target.closest('button') || e.target.closest('select') || e.target.closest('input')) return;
                isDraggingCanvas = true;
                dragStartX = e.clientX - panX;
                dragStartY = e.clientY - panY;
                viewport.style.cursor = 'grabbing';
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDraggingCanvas) return;
                panX = e.clientX - dragStartX;
                panY = e.clientY - dragStartY;
                updateZoomTransform();
            });

            window.addEventListener('mouseup', () => {
                if (isDraggingCanvas) {
                    isDraggingCanvas = false;
                    const vp = document.getElementById('svg-viewport');
                    if (vp) vp.style.cursor = 'grab';
                }
            });
        }

                AppState.stage1.segments.forEach(s => {
                    s.isOriginPlaced = false;

        // ==========================================
        // 3. SVG RENDERING ENGINE (PERFECT LAYER HIERARCHY)
        // ==========================================

        function renderSVG() {
            const container = document.getElementById('svg-layer-content');
            container.innerHTML = '';

            const stage = AppState.currentStage;

            if (stage === 'stage_1_forward') {
                renderStage1SVG(container);
            } else if (stage === 'stage_2_return') {
                renderStage2SVG(container);
            } else if (stage === 'stage_3_draw') {
                renderStage3SVG(container);
            } else if (stage === 'stage_4_custom') {
                renderStage4SVG(container);
            }
        }

        // ---- RENDER STAGE 1 (Example 5 Forward) ----
        function renderStage1SVG(g) {
            const segs = AppState.stage1.segments;
            const activeIdx = AppState.stage1.activeSegmentIdx;
            const currentSeg = segs[activeIdx];

            // Layer 1: Path lines
            segs.forEach((seg, idx) => {
                const isPassed = idx <= activeIdx;
                const isCurrent = idx === activeIdx;

                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", seg.fromPos.x);
                line.setAttribute("y1", seg.fromPos.y);
                line.setAttribute("x2", seg.toPos.x);
                line.setAttribute("y2", seg.toPos.y);
                line.setAttribute("stroke", isCurrent ? "#3b82f6" : (isPassed ? "#60a5fa" : "#334155"));
                line.setAttribute("stroke-width", isCurrent ? "4.5" : "2.5");
                if (!isPassed) line.setAttribute("stroke-dasharray", "5 5");
                g.appendChild(line);

                // Scale Ticks
                if (seg.isDistanceMeasured) {
                    drawScaleTicks(g, seg.fromPos, seg.toPos, seg.scaleSteps, 100);
                }
            });

            // Layer 2: Protractor Overlay (Drawn underneath crosshair & markers)
            if (AppState.showProtractor && currentSeg.fromPos) {
                drawProtractorOverlaySVG(g, currentSeg.fromPos, currentSeg);
            }

            // Layer 3: Compass Crosshair
            if (currentSeg.isOriginPlaced) {
                drawCompassCrosshair(g, currentSeg.fromPos, currentSeg.fromName);
            }

            // Layer 4: Angle Sector Arc & Ray Line
            segs.forEach((seg, idx) => {
                if (seg.isAngleMeasured && seg.angle > 0) {
                    drawAngleSectorArc(g, seg.fromPos, seg.baseDir, seg.biasDir, seg.angle, true);
                }
            });

            // Layer 5 (Top-most): Station Node Markers & Badges
            const waypoints = [
                { name: '学校', pos: segs[0].fromPos, icon: '🏫', color: '#3b82f6' },
                { name: '邮局', pos: segs[0].toPos, icon: '📮', color: '#10b981' },
                { name: '书店', pos: segs[1].toPos, icon: '📚', color: '#f59e0b' },
                { name: '小明家', pos: segs[2].toPos, icon: '🏠', color: '#ec4899' }
            ];

            waypoints.forEach((wpt, i) => {
                const isSelected = (i === activeIdx || i === activeIdx + 1);
                drawStationMarker(g, wpt.pos, wpt.name, wpt.icon, wpt.color, isSelected);
            });
        }

        // ---- RENDER STAGE 2 (Return Route Exploration) ----

        // ---- RENDER STAGE 4 (Custom Sandbox Workshop) ----
        function renderStage4SVG(g) {
            const wpts = AppState.stage4.waypoints;
            const segs = AppState.stage4.customSegments;

            segs.forEach(seg => {
                const wFrom = wpts.find(w => w.id === seg.fromId);
                const wTo = wpts.find(w => w.id === seg.toId);
                if (wFrom && wTo) {
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", wFrom.x);
                    line.setAttribute("y1", wFrom.y);
                    line.setAttribute("x2", wTo.x);
                    line.setAttribute("y2", wTo.y);
                    line.setAttribute("stroke", "#8b5cf6");
                    line.setAttribute("stroke-width", "4");
                    g.appendChild(line);

                    if (seg.isDirRevealed) {
                        drawAngleSectorArc(g, { x: wFrom.x, y: wFrom.y }, seg.baseDir, seg.biasDir, seg.angle, true);
                    }
                    if (seg.isDistRevealed) {
                        drawScaleTicks(g, { x: wFrom.x, y: wFrom.y }, { x: wTo.x, y: wTo.y }, Math.round(seg.dist / AppState.stage4.scaleRatio), AppState.stage4.scaleRatio);

                }
            });

            wpts.forEach((w) => {
                drawStationMarker(g, { x: w.x, y: w.y }, w.name, `📍`, "#8b5cf6", true);
            });

        // ==========================================
        // 4. SVG UTILITY GRAPHICS HELPERS (PERFECT SPACING & ZERO OVERLAPS)
        // ==========================================

        function drawStationMarker(g, pos, name, icon, color, isSelected) {
            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
            group.setAttribute("transform", `translate(${pos.x}, ${pos.y})`);

            if (isSelected) {
                const pulse = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                pulse.setAttribute("r", "22");
                pulse.setAttribute("fill", color);
                pulse.setAttribute("fill-opacity", "0.25");
                pulse.setAttribute("class", "animate-ping opacity-75");
                group.appendChild(pulse);
            }

            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("r", "16");
            circle.setAttribute("fill", "#0f172a");
            circle.setAttribute("stroke", color);
            circle.setAttribute("stroke-width", "3");
            group.appendChild(circle);

            const iconText = document.createElementNS("http://www.w3.org/2000/svg", "text");
            iconText.setAttribute("text-anchor", "middle");
            iconText.setAttribute("dominant-baseline", "central");
            iconText.setAttribute("font-size", "14");
            iconText.textContent = icon;
            group.appendChild(iconText);

            // Name Tag Badge (Positioned Above Node)
            const tagGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
            tagGroup.setAttribute("transform", "translate(0, -32)");

            const textWidth = name.length * 16 + 22;
            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.setAttribute("x", -textWidth / 2);
            rect.setAttribute("y", -14);
            rect.setAttribute("width", textWidth);
            rect.setAttribute("height", "28");
            rect.setAttribute("rx", "8");
            rect.setAttribute("fill", "#1e293b");
            rect.setAttribute("stroke", color);
            rect.setAttribute("stroke-width", "2");
            tagGroup.appendChild(rect);

            const nameText = document.createElementNS("http://www.w3.org/2000/svg", "text");
            nameText.setAttribute("text-anchor", "middle");
            nameText.setAttribute("dominant-baseline", "central");
            nameText.setAttribute("fill", "#f8fafc");
            nameText.setAttribute("font-size", "14");
            nameText.setAttribute("font-weight", "bold");
            nameText.textContent = name;
            tagGroup.appendChild(nameText);

            group.appendChild(tagGroup);
            g.appendChild(group);
        }

        function drawCompassCrosshair(g, pos, name) {
            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
            group.setAttribute("transform", `translate(${pos.x}, ${pos.y})`);

            const centerGlow = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            centerGlow.setAttribute("r", "8");
            centerGlow.setAttribute("fill", "#3b82f6");
            centerGlow.setAttribute("fill-opacity", "0.4");
            centerGlow.setAttribute("class", "animate-pulse");
            group.appendChild(centerGlow);

            const len = 70;
            const axes = [
                { label: '北', lx: 0, ly: -len - 14, color: '#ef4444' },
                { label: '东', lx: len + 16, ly: 2, color: '#38bdf8' },
                { label: '南', lx: 0, ly: len + 16, color: '#38bdf8' },
                { label: '西', lx: -len - 16, ly: 2, color: '#38bdf8' }
            ];

            const vLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
            vLine.setAttribute("x1", 0); vLine.setAttribute("y1", -len); vLine.setAttribute("x2", 0); vLine.setAttribute("y2", len);
            vLine.setAttribute("stroke", "#64748b"); vLine.setAttribute("stroke-width", "1.5"); vLine.setAttribute("stroke-dasharray", "3 3");
            group.appendChild(vLine);

            const hLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
            hLine.setAttribute("x1", -len); hLine.setAttribute("y1", 0); hLine.setAttribute("x2", len); hLine.setAttribute("y2", 0);
            hLine.setAttribute("stroke", "#64748b"); hLine.setAttribute("stroke-width", "1.5"); hLine.setAttribute("stroke-dasharray", "3 3");
            group.appendChild(hLine);

            axes.forEach(a => {
                const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
                t.setAttribute("x", a.lx);
                t.setAttribute("y", a.ly);
                t.setAttribute("fill", a.color);
                t.setAttribute("font-size", "14");
                t.setAttribute("font-weight", "bold");
                t.setAttribute("text-anchor", "middle");
                t.setAttribute("dominant-baseline", "central");
                t.textContent = a.label;
                group.appendChild(t);
            });

            // Origin Label Banner (Positioned Safely at Top-Left: x = -70, y = -len - 18)
            const textBg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            textBg.setAttribute("x", -135);
            textBg.setAttribute("y", -len - 30);
            textBg.setAttribute("width", 130);
            textBg.setAttribute("height", "24");
            textBg.setAttribute("rx", "6");
            textBg.setAttribute("fill", "#0f172a");
            textBg.setAttribute("stroke", "#3b82f6");
            textBg.setAttribute("stroke-width", "1.5");
            group.appendChild(textBg);

            const obsText = document.createElementNS("http://www.w3.org/2000/svg", "text");
            obsText.setAttribute("x", -70);
            obsText.setAttribute("y", -len - 18);
            obsText.setAttribute("fill", "#60a5fa");
            obsText.setAttribute("font-size", "12");
            obsText.setAttribute("font-weight", "bold");
            obsText.setAttribute("text-anchor", "middle");
            obsText.setAttribute("dominant-baseline", "central");
            obsText.textContent = `📍 观测点: ${name}`;
            group.appendChild(obsText);

            g.appendChild(group);
        }

        function drawProtractorOverlaySVG(g, pos, segInfo) {
            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
            group.setAttribute("transform", `translate(${pos.x}, ${pos.y})`);
            group.setAttribute("class", "cursor-pointer");

            const r = 105; // Compact radius to avoid invading adjacent stations

            // Glass Translucent Backdrop Circle
            const bgCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            bgCircle.setAttribute("r", r);
            bgCircle.setAttribute("fill", "rgba(15, 23, 42, 0.45)");
            bgCircle.setAttribute("stroke", "#38bdf8");
            bgCircle.setAttribute("stroke-width", "1.5");
            group.appendChild(bgCircle);

            // Inner Concentric Guide Ring
            const innerRing = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            innerRing.setAttribute("r", "60");
            innerRing.setAttribute("fill", "none");
            innerRing.setAttribute("stroke", "#0284c7");
            innerRing.setAttribute("stroke-width", "1");
            innerRing.setAttribute("stroke-dasharray", "3 3");
            group.appendChild(innerRing);

            // Ticks & Degree Numbers around 360 deg
            for (let deg = 0; deg < 360; deg += 5) {
                const rad = (deg * Math.PI) / 180;
                const isMajor = (deg % 30 === 0 || deg % 45 === 0);
                const isMedium = (deg % 10 === 0);
                const isCardinalAngle = (deg === 0 || deg === 90 || deg === 180 || deg === 270);

                const tickLen = isMajor ? 10 : (isMedium ? 6 : 3);
                const tickColor = isMajor ? "#fbbf24" : (isMedium ? "#38bdf8" : "#0284c7");
                const tickWidth = isMajor ? "2" : "1";

                const x1 = (r - tickLen) * Math.cos(rad);
                const y1 = (r - tickLen) * Math.sin(rad);
                const x2 = r * Math.cos(rad);
                const y2 = r * Math.sin(rad);

                const t = document.createElementNS("http://www.w3.org/2000/svg", "line");
                t.setAttribute("x1", x1); t.setAttribute("y1", y1); t.setAttribute("x2", x2); t.setAttribute("y2", y2);
                t.setAttribute("stroke", tickColor); t.setAttribute("stroke-width", tickWidth);
                group.appendChild(t);

                // Major degree text labels (30°, 45°, 60°...), skipping exact cardinal angles (0, 90, 180, 270)
                if (isMajor && !isCardinalAngle) {
                    const labelDist = r - 15;
                    const lx = labelDist * Math.cos(rad);
                    const ly = labelDist * Math.sin(rad);

                    const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    txt.setAttribute("x", lx);
                    txt.setAttribute("y", ly);
                    txt.setAttribute("fill", "#7dd3fc");
                    txt.setAttribute("font-size", "10");
                    txt.setAttribute("font-weight", "bold");
                    txt.setAttribute("text-anchor", "middle");
                    txt.setAttribute("dominant-baseline", "central");
                    txt.textContent = `${deg}°`;
                    group.appendChild(txt);
                }
            }

            // Target Angle Pointer Ray Line & Callout Tag
            if (segInfo && segInfo.angle > 0) {
                let baseAngleDeg = 90;
                if (segInfo.baseDir === '北') baseAngleDeg = 270;
                if (segInfo.baseDir === '东') baseAngleDeg = 0;
                if (segInfo.baseDir === '西') baseAngleDeg = 180;

                let targetAngleDeg = baseAngleDeg;
                if (segInfo.baseDir === '南' && segInfo.biasDir === '东') targetAngleDeg = 90 - segInfo.angle;
                if (segInfo.baseDir === '南' && segInfo.biasDir === '西') targetAngleDeg = 90 + segInfo.angle;
                if (segInfo.baseDir === '北' && segInfo.biasDir === '东') targetAngleDeg = 270 + segInfo.angle;
                if (segInfo.baseDir === '北' && segInfo.biasDir === '西') targetAngleDeg = 270 - segInfo.angle;

                const targetRad = (targetAngleDeg * Math.PI) / 180;
                const rx = r * Math.cos(targetRad);
                const ry = r * Math.sin(targetRad);

                const ray = document.createElementNS("http://www.w3.org/2000/svg", "line");
                ray.setAttribute("x1", 0); ray.setAttribute("y1", 0);
                ray.setAttribute("x2", rx); ray.setAttribute("y2", ry);
                ray.setAttribute("stroke", "#fbbf24");
                ray.setAttribute("stroke-width", "3");
                ray.setAttribute("stroke-dasharray", "4 2");
                group.appendChild(ray);

                const badgeGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
                badgeGroup.setAttribute("transform", `translate(${rx * 1.12}, ${ry * 1.12})`);

                const bRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                bRect.setAttribute("x", -24); bRect.setAttribute("y", -11);
                bRect.setAttribute("width", 48); bRect.setAttribute("height", "22");
                bRect.setAttribute("rx", "4");
                bRect.setAttribute("fill", "#0f172a");
                bRect.setAttribute("stroke", "#fbbf24");
                bRect.setAttribute("stroke-width", "1.5");
                badgeGroup.appendChild(bRect);

                const bTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
                bTxt.setAttribute("x", 0); bTxt.setAttribute("y", 0);
                bTxt.setAttribute("fill", "#fbbf24");
                bTxt.setAttribute("font-size", "11");
                bTxt.setAttribute("font-weight", "bold");
                bTxt.setAttribute("text-anchor", "middle");
                bTxt.setAttribute("dominant-baseline", "central");
                bTxt.textContent = `${segInfo.angle}°`;
                badgeGroup.appendChild(bTxt);

                group.appendChild(badgeGroup);
            }

            // Interactive Hover Angle Inspector Badge
            const hoverTag = document.createElementNS("http://www.w3.org/2000/svg", "g");
            hoverTag.setAttribute("display", "none");

            const hRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            hRect.setAttribute("x", -50); hRect.setAttribute("y", -12);
            hRect.setAttribute("width", 100); hRect.setAttribute("height", "24");
            hRect.setAttribute("rx", "6");
            hRect.setAttribute("fill", "#1e1b4b");
            hRect.setAttribute("stroke", "#38bdf8");
            hRect.setAttribute("stroke-width", "1.5");
            hoverTag.appendChild(hRect);

            const hTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
            hTxt.setAttribute("x", 0); hTxt.setAttribute("y", 0);
            hTxt.setAttribute("fill", "#38bdf8");
            hTxt.setAttribute("font-size", "11");
            hTxt.setAttribute("font-weight", "bold");
            hTxt.setAttribute("text-anchor", "middle");
            hTxt.setAttribute("dominant-baseline", "central");
            hTxt.textContent = "刻度: 0°";
            hoverTag.appendChild(hTxt);

            group.appendChild(hoverTag);

            group.onmousemove = (e) => {
                const rect = group.getBoundingClientRect();
                const mouseX = e.clientX - rect.left - rect.width / 2;
                const mouseY = e.clientY - rect.top - rect.height / 2;
                let deg = Math.round((Math.atan2(mouseY, mouseX) * 180) / Math.PI);
                if (deg < 0) deg += 360;

                hoverTag.setAttribute("transform", `translate(${mouseX * 0.8}, ${mouseY * 0.8})`);
                hoverTag.setAttribute("display", "block");
                hTxt.textContent = `量角刻度: ${deg}°`;
            };

            group.onmouseleave = () => {
                hoverTag.setAttribute("display", "none");
            };

            g.appendChild(group);
        }

        function drawAngleSectorArc(g, pos, baseDir, biasDir, angle, isRevealed) {
            if (!isRevealed || angle <= 0) return;

            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
            group.setAttribute("transform", `translate(${pos.x}, ${pos.y})`);

            const r = 44;

            let baseAngleDeg = 90;
            if (baseDir === '北') baseAngleDeg = 270;
            if (baseDir === '东') baseAngleDeg = 0;
            if (baseDir === '西') baseAngleDeg = 180;

            let targetAngleDeg = baseAngleDeg;
            if (baseDir === '南' && biasDir === '东') targetAngleDeg = 90 - angle;
            if (baseDir === '南' && biasDir === '西') targetAngleDeg = 90 + angle;
            if (baseDir === '北' && biasDir === '东') targetAngleDeg = 270 + angle;
            if (baseDir === '北' && biasDir === '西') targetAngleDeg = 270 - angle;

            const startRad = (baseAngleDeg * Math.PI) / 180;
            const endRad = (targetAngleDeg * Math.PI) / 180;

            const x1 = r * Math.cos(startRad);
            const y1 = r * Math.sin(startRad);
            const x2 = r * Math.cos(endRad);
            const y2 = r * Math.sin(endRad);

            const sweepFlag = targetAngleDeg > baseAngleDeg ? 1 : 0;
            const d = `M 0 0 L ${x1} ${y1} A ${r} ${r} 0 0 ${sweepFlag} ${x2} ${y2} Z`;

            const sector = document.createElementNS("http://www.w3.org/2000/svg", "path");
            sector.setAttribute("d", d);
            sector.setAttribute("fill", "rgba(245, 158, 11, 0.35)");
            sector.setAttribute("stroke", "#f59e0b");
            sector.setAttribute("stroke-width", "2");
            group.appendChild(sector);

            const midRad = (startRad + endRad) / 2;
            const textDist = r + 18;
            const tx = textDist * Math.cos(midRad);
            const ty = textDist * Math.sin(midRad);

            const angleText = document.createElementNS("http://www.w3.org/2000/svg", "text");
            angleText.setAttribute("x", tx);
            angleText.setAttribute("y", ty);
            angleText.setAttribute("fill", "#fbbf24");
            angleText.setAttribute("font-size", "14");
            angleText.setAttribute("font-weight", "bold");
            angleText.setAttribute("text-anchor", "middle");
            angleText.setAttribute("dominant-baseline", "central");
            angleText.textContent = `${angle}°`;
            group.appendChild(angleText);

            g.appendChild(group);
        }

        function drawScaleTicks(g, p1, p2, steps, stepMeterVal) {
            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");

            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const totalDist = Math.hypot(dx, dy);

            if (totalDist === 0) return;

            const unitDx = dx / steps;
            const unitDy = dy / steps;

            const nx = -dy / totalDist * 7;
            const ny = dx / totalDist * 7;

            for (let i = 1; i <= steps; i++) {
                const tx = p1.x + unitDx * i;
                const ty = p1.y + unitDy * i;

                const tick = document.createElementNS("http://www.w3.org/2000/svg", "line");
                tick.setAttribute("x1", tx - nx);
                tick.setAttribute("y1", ty - ny);
                tick.setAttribute("x2", tx + nx);
                tick.setAttribute("y2", ty + ny);
                tick.setAttribute("stroke", "#fbbf24");
                tick.setAttribute("stroke-width", "2.5");
                group.appendChild(tick);

                const tickText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                tickText.setAttribute("x", tx + nx * 2.4);
                tickText.setAttribute("y", ty + ny * 2.4);
                tickText.setAttribute("fill", "#fbbf24");
                tickText.setAttribute("font-size", "12");
                tickText.setAttribute("font-weight", "bold");
                tickText.setAttribute("text-anchor", "middle");
                tickText.setAttribute("dominant-baseline", "central");
                tickText.textContent = `${i * stepMeterVal}m`;
                group.appendChild(tickText);
            }

            g.appendChild(group);
        }

        function drawArrowHead(g, p1, p2, color) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const angle = Math.atan2(dy, dx);

            const mx = (p1.x + p2.x) / 2;
            const my = (p1.y + p2.y) / 2;

            const arrow = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            const size = 10;
            const pA = `${mx + size * Math.cos(angle)},${my + size * Math.sin(angle)}`;
            const pB = `${mx - size * Math.cos(angle - Math.PI / 6)},${my - size * Math.sin(angle - Math.PI / 6)}`;
            const pC = `${mx - size * Math.cos(angle + Math.PI / 6)},${my - size * Math.sin(angle + Math.PI / 6)}`;

            arrow.setAttribute("points", `${pA} ${pB} ${pC}`);
            arrow.setAttribute("fill", color);
            g.appendChild(arrow);
        }

                <div class="p-3.5 rounded-xl bg-slate-900 border border-slate-800 space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-bold text-slate-200">2. 相对方向与内错角</span>
                        <button onclick="revealStage2Step('direction')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${cur.isDirectionRevealed ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-amber-600 text-white'}">
                            ${cur.isDirectionRevealed ? '🙈 点击隐藏方向' : '🧭 揭晓返程方向'}
                        </button>
                    </div>
                    ${cur.isDirectionRevealed ? `
                        <div class="p-2.5 rounded-lg bg-amber-500/10 border border-amber-500/20 text-sm text-amber-300 font-bold">
                            返程方向：<span class="text-white bg-amber-600 px-2 py-0.5 rounded font-bold">${cur.dirAns}</span>
                        </div>
                    ` : ''}
                </div>

                <!-- RETURN STEP 3 -->
                <div class="p-3.5 rounded-xl bg-slate-900 border border-slate-800 space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-bold text-slate-200">3. 返程实际距离</span>
                        <button onclick="revealStage2Step('distance')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${cur.isDistanceRevealed ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/40' : 'bg-indigo-600 text-white'}">
                            ${cur.isDistanceRevealed ? '🙈 点击隐藏距离' : '📏 揭晓距离'}
                        </button>
                    </div>
                    ${cur.isDistanceRevealed ? `
                        <div class="p-2.5 rounded-lg bg-indigo-500/10 border border-indigo-500/20 text-sm text-indigo-300 font-bold">
                            返程距离：<span class="text-white font-extrabold">${cur.distAns}</span> (与去时完全相同)
                        </div>
                    ` : ''}
                </div>
            `;
            container.appendChild(card);

            // Secret Flashcard
            const flipContainer = document.createElement('div');
            flipContainer.className = 'flip-card cursor-pointer my-2';
            flipContainer.onclick = () => {
                flipContainer.classList.toggle('flipped');
                playSound('click');
            };

            flipContainer.innerHTML = `
                <div class="flip-card-inner glass-card rounded-xl border border-amber-500/30 p-4 text-center">
                    <div class="flip-card-front flex flex-col items-center justify-center space-y-1.5">
                        <span class="text-3xl">💡</span>
                        <span class="text-sm font-bold text-amber-300">点击翻转：原路返回核心秘诀口诀</span>
                        <span class="text-xs text-slate-400">（起点终点对调，方向如何变？）</span>
                    </div>
                    <div class="flip-card-back flex flex-col items-center justify-center space-y-1.5">
                        <span class="text-sm font-bold text-emerald-400">🌟 原路返回四大铁律 🌟</span>
                        <p class="text-xs text-slate-100 leading-relaxed font-bold">
                            起点终点互换，距离数值不变，<br/>
                            角度大小不变，方向完全相反！<br/>
                            <span class="text-amber-300 font-semibold">(东变西、南变北，南偏东30° ➔ 北偏西30°)</span>
                        </p>
                    </div>
                </div>
            `;
            container.appendChild(flipContainer);
        }

        // TOGGLE REVELATION FUNCTION FOR STAGE 2
        function revealStage2Step(type) {
            const cur = AppState.stage2.returns[AppState.stage2.activeReturnIdx];
            let isOpening = false;

            if (type === 'origin') { cur.isOriginPlaced = !cur.isOriginPlaced; isOpening = cur.isOriginPlaced; }
            if (type === 'direction') { cur.isDirectionRevealed = !cur.isDirectionRevealed; isOpening = cur.isDirectionRevealed; }
            if (type === 'distance') { cur.isDistanceRevealed = !cur.isDistanceRevealed; isOpening = cur.isDistanceRevealed; }

            playSound(isOpening ? 'reveal' : 'hide');
            renderSVG();
            renderDrawer();
        }

        // ---- STAGE 3 DRAWER UI ----
        function renderStage3Drawer(container) {
            const st = AppState.stage3;

            const card = document.createElement('div');
            card.className = 'glass-card p-4 rounded-xl border border-slate-800 space-y-4';

            card.innerHTML = `
                <div class="flex items-center justify-between">
                    <span class="text-sm font-bold text-blue-400">📐 做一做 P9 画路线规程</span>
                    <span class="text-xs text-slate-400 font-medium">比例尺 1格 = 50m</span>
                </div>

                <div class="p-3 rounded-xl bg-slate-900 border border-slate-800 text-sm text-amber-300 font-medium leading-relaxed">
                    <b>情境题目：</b>“我沿正南方向走 50m 到路口，再沿南偏西 30° 方向走 100m 到公园。”
                </div>

                <!-- STEP 1 -->
                <div class="p-3.5 rounded-xl bg-slate-900 border ${st.startPlaced ? 'border-emerald-500/50 bg-emerald-950/20' : 'border-slate-800'} space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-bold text-slate-200">1. 定起点并建坐标系</span>
                        <button onclick="handleStage3Action(1)" class="px-3 py-1.5 rounded-lg text-xs font-bold ${st.startPlaced ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-blue-600 text-white'}">
                            ${st.startPlaced ? '🙈 隐藏家起点' : '📍 定起点 (家)'}
                        </button>
                    </div>
                </div>

                <!-- STEP 2 -->
                <div class="p-3.5 rounded-xl bg-slate-900 border ${st.segment1Done ? 'border-emerald-500/50 bg-emerald-950/20' : 'border-slate-800'} space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-bold text-slate-200">2. 画第1段 (正南 50m 到路口)</span>
                        <button onclick="handleStage3Action(2)" class="px-3 py-1.5 rounded-lg text-xs font-bold ${st.segment1Done ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-blue-600 text-white'}" ${!st.startPlaced ? 'disabled opacity-50' : ''}>
                            ${st.segment1Done ? '🙈 隐藏第1段' : '🖊 标定路口线段'}
                        </button>
                    </div>
                </div>

                <!-- STEP 3 -->
                <div class="p-3.5 rounded-xl bg-slate-900 border ${st.originShifted ? 'border-emerald-500/50 bg-emerald-950/20' : 'border-amber-500/50'} space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-bold text-amber-300">3. 观测点跃迁 (关键易错!)</span>
                        <button onclick="handleStage3Action(3)" class="px-3 py-1.5 rounded-lg text-xs font-bold ${st.originShifted ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-amber-600 text-white'}" ${!st.segment1Done ? 'disabled opacity-50' : ''}>
                            ${st.originShifted ? '🙈 隐藏路口坐标' : '📍 在路口设新十字标'}
                        </button>
                    </div>
                    <p class="text-xs text-slate-400 leading-relaxed">🚨 算理防错：走到路口后，观测点已变为【路口】，必须重新确立坐标系！</p>
                </div>

                <!-- STEP 4 -->
                <div class="p-3.5 rounded-xl bg-slate-900 border ${st.segment2Done ? 'border-emerald-500/50 bg-emerald-950/20' : 'border-slate-800'} space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-bold text-slate-200">4. 画第2段 (南偏西 30° 100m)</span>
                        <button onclick="handleStage3Action(4)" class="px-3 py-1.5 rounded-lg text-xs font-bold ${st.segment2Done ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-blue-600 text-white'}" ${!st.originShifted ? 'disabled opacity-50' : ''}>
                            ${st.segment2Done ? '🙈 隐藏第2段' : '🖊 画第二段到公园'}
                        </button>
                    </div>
                </div>

                <!-- STEP 5 -->
                <div class="pt-2">
                    <button onclick="handleStage3Action(5)" class="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-bold shadow-lg ${!st.segment2Done ? 'opacity-50 cursor-not-allowed' : ''}" ${!st.segment2Done ? 'disabled' : ''}>
                        ${st.verified ? '🙈 隐藏标准答案对比' : '✨ 揭晓标准作图重合核验'}
                    </button>
                </div>
            `;
            container.appendChild(card);

            if (st.verified) {
                const verCard = document.createElement('div');
                verCard.className = 'glass-card p-4 rounded-xl border border-emerald-500/40 bg-emerald-950/30 space-y-2 text-sm text-emerald-200 animate-fade-in';
                verCard.innerHTML = `
                    <div class="flex items-center space-x-2 font-bold text-emerald-400 text-base">
                        <span>🎉 作图核验成功！精准度 100%</span>
                    </div>
                    <p class="leading-relaxed text-xs">
                        红色虚线为教材标准示意图。你的标绘完全契合“定起点 ➔ 建立坐标系 ➔ 旋转量角 ➔ 截取比例距离”作图规范！
                    </p>
                `;
                container.appendChild(verCard);
            }
        }

        function handleStage3Action(step) {
            const st = AppState.stage3;
            if (step === 1) { st.startPlaced = !st.startPlaced; }
            else if (step === 2) { st.segment1Done = !st.segment1Done; }
            else if (step === 3) { st.originShifted = !st.originShifted; }
            else if (step === 4) { st.segment2Done = !st.segment2Done; }
            else if (step === 5) { st.verified = !st.verified; }

            playSound('click');
            renderSVG();
            renderDrawer();
        }

        // ---- STAGE 4 DRAWER UI ----
        function renderStage4Drawer(container) {
            const st = AppState.stage4;

            const card = document.createElement('div');
            card.className = 'glass-card p-4 rounded-xl border border-slate-800 space-y-4';

            card.innerHTML = `
                <div class="flex items-center justify-between">
                    <span class="text-sm font-bold text-purple-400">🧪 开放式出题实验室</span>
                    <div class="flex space-x-1 p-1 bg-slate-900 rounded-lg">
                        <button onclick="switchStage4Mode('creator')" class="px-2.5 py-1 text-xs font-bold rounded ${st.mode === 'creator' ? 'bg-purple-600 text-white' : 'text-slate-400'}">出题制图</button>
                        <button onclick="switchStage4Mode('solver')" class="px-2.5 py-1 text-xs font-bold rounded ${st.mode === 'solver' ? 'bg-purple-600 text-white' : 'text-slate-400'}">交互做题</button>
                    </div>
                </div>

                ${st.mode === 'creator' ? `
                    <div class="space-y-3 text-xs">
                        <div class="p-3 rounded-lg bg-slate-900 border border-slate-800 text-slate-300 space-y-1">
                            <div class="font-bold text-purple-300 text-sm">操作指南：</div>
                            <p class="text-xs text-slate-400 leading-relaxed font-medium">自定义生成站点路线图。可修改比例尺，并一键封装为试题卡。</p>
                        </div>
                        <div class="flex items-center justify-between pt-1">
                            <label class="text-slate-200 font-bold text-xs">比例尺基准:</label>
                            <select onchange="updateStage4Scale(this.value)" class="bg-slate-900 text-purple-300 px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-bold">
                                <option value="50" ${st.scaleRatio === 50 ? 'selected' : ''}>1格 = 50米</option>
                                <option value="100" ${st.scaleRatio === 100 ? 'selected' : ''}>1格 = 100米</option>
                                <option value="200" ${st.scaleRatio === 200 ? 'selected' : ''}>1格 = 200米</option>
                            </select>
                        </div>
                        <button onclick="switchStage4Mode('solver')" class="w-full py-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs shadow-lg shadow-purple-500/20">
                            🔒 封装生成路线试题
                        </button>
                    </div>
                ` : `
                    <div class="space-y-4 text-xs">
                        <div class="p-3.5 rounded-xl bg-slate-900 border border-slate-800 space-y-2.5">
                            <span class="font-bold text-purple-300 text-sm">试题 1: A少年宫 ➔ B图书馆</span>
                            <div class="flex items-center justify-between pt-1 space-x-2">
                                <button onclick="revealStage4Ans(0, 'dir')" class="flex-1 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-purple-300 font-bold text-xs border border-slate-700">
                                    ${st.customSegments[0].isDirRevealed ? '🙈 隐藏 (南偏东 60°)' : '👁 偷看方向'}
                                </button>
                                <button onclick="revealStage4Ans(0, 'dist')" class="flex-1 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-purple-300 font-bold text-xs border border-slate-700">
                                    ${st.customSegments[0].isDistRevealed ? '🙈 隐藏 (300米)' : '📏 偷看距离'}
                                </button>
                            </div>
                        </div>

                        <div class="p-3.5 rounded-xl bg-slate-900 border border-slate-800 space-y-2.5">
                            <span class="font-bold text-purple-300 text-sm">试题 2: B图书馆 ➔ C体育馆</span>
                            <div class="flex items-center justify-between pt-1 space-x-2">
                                <button onclick="revealStage4Ans(1, 'dir')" class="flex-1 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-purple-300 font-bold text-xs border border-slate-700">
                                    ${st.customSegments[1].isDirRevealed ? '🙈 隐藏 (南偏东 30°)' : '👁 偷看方向'}
                                </button>
                                <button onclick="revealStage4Ans(1, 'dist')" class="flex-1 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-purple-300 font-bold text-xs border border-slate-700">
                                    ${st.customSegments[1].isDistRevealed ? '🙈 隐藏 (400米)' : '📏 偷看距离'}
                                </button>
                            </div>
                        </div>
                    </div>
                `}
            `;
            container.appendChild(card);
        }

        function switchStage4Mode(mode) {
            AppState.stage4.mode = mode;
            playSound('click');
            renderSVG();
            renderDrawer();
        }

        function updateStage4Scale(val) {
            AppState.stage4.scaleRatio = parseInt(val);
            document.getElementById('scale-legend-text').textContent = `1格线段 = ${val}米`;
            renderSVG();
        }

        // TOGGLE REVELATION FUNCTION FOR STAGE 4
        function revealStage4Ans(idx, type) {
            const seg = AppState.stage4.customSegments[idx];
            let isOpening = false;

            if (type === 'dir') { seg.isDirRevealed = !seg.isDirRevealed; isOpening = seg.isDirRevealed; }
            if (type === 'dist') { seg.isDistRevealed = !seg.isDistRevealed; isOpening = seg.isDistRevealed; }

            playSound(isOpening ? 'reveal' : 'hide');
            renderSVG();
            renderDrawer();
        }

        // ==========================================
        // 6. SUMMARY & MODAL CONTROLLER
        // ==========================================

        function toggleGlobalSummaryModal() {
            playSound('click');
            const modal = document.getElementById('summary-modal');
            const body = document.getElementById('modal-body');

            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                body.innerHTML = `
                    <div class="space-y-4">
                        <div class="p-4 rounded-xl bg-blue-950/40 border border-blue-500/30">
                            <h4 class="font-bold text-blue-300 text-base mb-2">📌 1. 描述路线的三要素规范</h4>
                            <p class="leading-relaxed text-sm">
                                描述路线必须包含：<b>观测点 (起点)</b>、<b>偏转方向与角度</b>、<b>实际行走距离</b>。<br/>
                                <span class="text-amber-300 font-bold">标准格式：从 [起点] 出发，向 [基准方向] 偏 [偏转方向] [角度]° 方向走 [距离] 米到达 [终点]。</span>
                            </p>
                        </div>

                        <div class="p-4 rounded-xl bg-amber-950/40 border border-amber-500/30">
                            <h4 class="font-bold text-amber-300 text-base mb-2">📌 2. 观测点跃迁规律 (每走一段起点就变)</h4>
                            <p class="leading-relaxed text-sm">
                                每走到一个新的站点，该站点就成为<b>新的起点/观测点</b>。必须在该点重新画出十字方向标，建立新的直角坐标系。
                            </p>
                        </div>

                        <div class="p-4 rounded-xl bg-emerald-950/40 border border-emerald-500/30">
                            <h4 class="font-bold text-emerald-300 text-base mb-2">📌 3. 原路返回相对性 (内错角与方向互逆)</h4>
                            <p class="leading-relaxed text-sm">
                                原路返回时：<b>起点终点互换，距离数值不变，角度数值不变，方向完全相反</b> (如：南偏东 30° ➔ 返程变为 北偏西 30°)。
                            </p>
                        </div>

                        <div class="p-4 rounded-xl bg-purple-950/40 border border-purple-500/30">
                            <h4 class="font-bold text-purple-300 text-base mb-2">📌 4. 听描述规范画图五步法</h4>
                            <p class="leading-relaxed text-sm">
                                <b>① 定起点建坐标系</b> ➔ <b>② 用量角器量偏角</b> ➔ <b>③ 沿角度画射线</b> ➔ <b>④ 按比例尺截取段数标距离</b> ➔ <b>⑤ 标注终点名称</b>。
                            </p>
                        </div>
                    </div>
                `;
            } else {
                modal.classList.add('hidden');
            }
        }

        // ==========================================
        // 7. INITIALIZATION ON LOAD
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            initZoomPanEvents();
            switchStage('stage_1_forward');
        });
    </script>
</body>

</html>
