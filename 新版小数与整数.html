<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10×10 网格涂色与合并教学互动课件 - 小数乘整数</title>

    <!-- 引入本地 Tailwind CSS 运行时 -->
    <script src="./tailwind/tailwind.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pageBg: '#f8fafc',
                        cellLight: '#ffffff',
                        cellBorder: '#cbd5e1',
                        colorA: {
                            DEFAULT: '#0ea5e9',
                            glow: 'rgba(14, 165, 233, 0.4)',
                            light: '#e0f2fe'
                        },
                        colorB: {
                            DEFAULT: '#f97316',
                            glow: 'rgba(249, 115, 22, 0.4)',
                            light: '#ffedd5'
                        },
                        colorC: {
                            DEFAULT: '#8b5cf6',
                            glow: 'rgba(139, 92, 246, 0.4)',
                            light: '#ede9fe'
                        }
                    },
                    boxShadow: {
                        'glow-a': '0 2px 10px rgba(14, 165, 233, 0.35)',
                        'glow-b': '0 2px 10px rgba(249, 115, 22, 0.35)',
                        'glow-c': '0 2px 10px rgba(139, 92, 246, 0.35)',
                    }
                }
            }
        };
    </script>

    <style>
        /* 根变量与高对比度浅色模式 */
        :root {
            --bg-page: #f8fafc;
            --cell-bg: #ffffff;
            --cell-border: #cbd5e1;
            --color-a: #0ea5e9;
            --color-b: #f97316;
            --color-c: #8b5cf6;
            /* 响应式动态自适应计算：最大化铺满视口剩余空间，且保持 1:1 正方形 */
            --board-size: min(calc(100vw - 64px), calc(100vh - 100px));
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100vh;
            max-height: 100vh;
            background-color: var(--bg-page);
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 明亮教学环境柔和光晕纹理 */
        .ambient-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(circle at 16% 18%, rgba(14, 165, 233, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 84% 20%, rgba(249, 115, 22, 0.07) 0%, transparent 50%),
                radial-gradient(circle at 50% 85%, rgba(139, 92, 246, 0.07) 0%, transparent 55%);
        }

        /* 保证大正方形 1:1 最大化铺满视口且不溢出 */
        .board-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .main-square-board {
            /* 最大化自适应铺满剩余空间 */
            width: var(--board-size);
            height: var(--board-size);
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: clamp(2.5px, 0.4vw, 5px);
            padding: clamp(4px, 0.6vw, 8px);
            touch-action: none;
        }

        /* 单元格清晰网格基本样式与过渡 */
        .grid-cell {
            position: relative;
            background-color: var(--cell-bg);
            border-radius: clamp(3px, 0.5vw, 6px);
            transition: transform 0.14s ease, background-color 0.18s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.18s ease;
            box-shadow: inset 0 0 0 1px var(--cell-border);
            cursor: pointer;
            touch-action: none;
        }

        .grid-cell:hover {
            filter: brightness(0.97);
            transform: scale(1.05);
            box-shadow: inset 0 0 0 1.5px #0ea5e9, 0 2px 8px rgba(14, 165, 233, 0.2);
            z-index: 5;
        }

        .grid-cell:active {
            transform: scale(0.95);
        }

        /* 各颜色涂色状态（白底高对比、色彩鲜艳分明） */
        .grid-cell.colored-a {
            background-color: var(--color-a) !important;
            box-shadow: 0 2px 8px rgba(14, 165, 233, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.6) !important;
        }

        .grid-cell.colored-b {
            background-color: var(--color-b) !important;
            box-shadow: 0 2px 8px rgba(249, 115, 22, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.6) !important;
        }

        .grid-cell.colored-c {
            background-color: var(--color-c) !important;
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.6) !important;
        }

        /* 拆分模式下的三小网格 */
        .mini-grid {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 1.5px;
            padding: 4px;
            border-radius: 12px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            touch-action: none;
        }

        .mini-cell {
            background-color: var(--cell-bg);
            border-radius: 2px;
            box-shadow: inset 0 0 0 0.5px var(--cell-border);
            transition: background-color 0.2s ease;
        }

        .mini-cell.colored-a {
            background-color: var(--color-a) !important;
            box-shadow: 0 1px 4px rgba(14, 165, 233, 0.4) !important;
        }

        .mini-cell.colored-b {
            background-color: var(--color-b) !important;
            box-shadow: 0 1px 4px rgba(249, 115, 22, 0.4) !important;
        }

        .mini-cell.colored-c {
            background-color: var(--color-c) !important;
            box-shadow: 0 1px 4px rgba(139, 92, 246, 0.4) !important;
        }

        /* 教学白色毛玻璃面板卡片通用样式 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* 标尺行号列号文字（加粗清晰易读） */
        .board-ruler-text {
            font-size: 11px;
            font-weight: 700;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: #64748b;
        }
    </style>
</head>

<body class="h-screen w-screen flex flex-col bg-slate-50 text-slate-800 overflow-hidden selection:bg-sky-500/20">
    <!-- 空间环境背景柔和光晕 -->
    <div class="ambient-glow"></div>

    <!-- 主容器 -->
    <div class="relative z-10 flex flex-col h-screen w-full overflow-hidden">

        <!-- ==============================================
             顶部导航与操作工具栏 (PRD 2.1 & 4)
             ============================================== -->
        <header class="w-full glass-panel border-b border-slate-200/90 px-4 py-2.5 shadow-sm sticky top-0 z-30">
            <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                <!-- 课件标题与知识点引导 -->
                <div class="flex items-center gap-3">
                    <div>
                        <div class="flex items-center gap-2.5">
                            <h1 class="text-base md:text-lg font-extrabold tracking-tight text-slate-800">小数乘整数</h1>
                            <span
                                class="text-xs px-2.5 py-0.5 rounded-full bg-sky-50 text-sky-700 border border-sky-200 font-bold tracking-wide">0.18

                        </div>
                    </div>
                </div>

                <!-- 核心工具箱：4种笔刷选择 (PRD 3.1 & 4) -->
                <div
                    class="flex items-center bg-slate-100/90 p-1 rounded-2xl border border-slate-200 shadow-inner gap-1">
                    <!-- 颜色 A (天蓝) -->

                        <span class="w-4 h-4 rounded-full bg-[#0ea5e9] shadow-[0_0_6px_rgba(14,165,233,0.5)]"></span>

                    <!-- 颜色 B (暖橙) -->

                    <!-- 颜色 C (淡紫) -->

                        <span class="w-4 h-4 rounded-full bg-[#8b5cf6] shadow-[0_0_6px_rgba(139,92,246,0.5)]"></span>
                        <span>颜色 C</span>

                    <!-- 橡皮擦 (PRD 3.3) -->
                    <button id="btn-tool-eraser" data-tool="ERASER"

                        <svg class="w-4 h-4 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21">
                            </path>
                            <path d="M22 21H7"></path>
                            <path d="m5 11 9 9"></path>
                        </svg>
                        <span>橡皮擦</span>
                    </button>
                </div>

                <!-- 快捷与控制按钮组 (PRD 3.2, 3.4 & 4) -->
                <div class="flex items-center gap-2">
                    <!-- 快捷生成 18 格 (PRD 3.2) -->
                    <button id="btn-quick-18"
                        class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-500 hover:to-blue-500 text-white text-xs md:text-sm font-bold shadow-md hover:shadow-sky-500/30 transition-all duration-200 hover:scale-105 active:scale-95 cursor-pointer">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <rect width="18" height="18" x="3" y="3" rx="2"></rect>

                    <!-- 排布模式切换：分行对比 (3×18) vs 紧密拼满 (累计54格) -->
                    <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs">
                        <button id="btn-pack-split-rows"

                            分行对比
                        </button>
                        <button id="btn-pack-compact"

                            紧密拼满
                        </button>
                    </div>

                    <!-- 全部清空 (PRD 4) -->
                    <button id="btn-clear-all"
                        class="p-2 rounded-xl bg-slate-100 hover:bg-rose-50 text-slate-500 hover:text-rose-600 border border-slate-200 hover:border-rose-300 transition-all duration-200 cursor-pointer shadow-xs"
                        title="全部清空">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <path d="M3 6h18"></path>
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                        </svg>
                    </button>

                    <!-- 音效切换开关 -->
                    <button id="btn-sound-toggle"

                        title="音效开关">
                        <svg id="icon-sound" class="w-4 h-4 text-sky-600" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.2">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- ==============================================
             主体视口展示区 (自适应 1:1 最大正方形)
             ============================================== -->
        <main class="flex-1 flex flex-col items-center justify-center p-1.5 sm:p-2 w-full mx-auto">

            <!-- 模式 A：单一大正方形铺满主视口 (默认涂色与合并展示视图) -->
            <div id="view-single-grid"
                class="w-full flex-1 flex flex-col items-center justify-center transition-all duration-500">

                <!-- 标尺与正方形容器外层 -->
                <div class="relative flex flex-col items-center justify-center">

                    <!-- 顶部列标尺 (1~10列，宽度精确与大网格一致并按10列网格居中对齐) -->
                    <div class="grid grid-cols-10 mb-1.5 board-ruler-text text-center select-none"
                        style="width: var(--board-size);">
                        <span>1</span>
                        <span>2</span>
                        <span>3</span>
                        <span>4</span>
                        <span>5</span>
                        <span>6</span>
                        <span>7</span>
                        <span>8</span>
                        <span>9</span>
                        <span>10</span>
                    </div>

                    <div class="flex items-center">
                        <!-- 左侧行标尺 (1~10行，高度精确与大网格一致并按10行网格居中对齐) -->
                        <div class="grid grid-rows-10 mr-1.5 board-ruler-text select-none items-center justify-center text-center"
                            style="height: var(--board-size);">
                            <span class="flex items-center justify-center">1</span>
                            <span class="flex items-center justify-center">2</span>
                            <span class="flex items-center justify-center">3</span>
                            <span class="flex items-center justify-center">4</span>
                            <span class="flex items-center justify-center">5</span>
                            <span class="flex items-center justify-center">6</span>
                            <span class="flex items-center justify-center">7</span>
                            <span class="flex items-center justify-center">8</span>
                            <span class="flex items-center justify-center">9</span>
                            <span class="flex items-center justify-center">10</span>
                        </div>

                        <!-- 10×10 大正方形网格板 (白底明朗高对比) -->
                        <div class="relative p-2 sm:p-2.5 rounded-2xl bg-white border border-slate-200/90 shadow-xl shadow-slate-200/60">
                            <div id="main-grid-board"
                                class="main-square-board bg-slate-50/80 rounded-xl border border-slate-200/70 select-none">
                                <!-- JS 动态渲染 100 个格子 -->
                            </div>

                            <!-- 涂色状态悬浮指示微章 (当鼠标悬浮或滑动时显示) -->
                            <div id="grid-hover-tip"
                                class="absolute -top-3.5 right-4 px-3 py-0.5 rounded-full bg-slate-800/90 text-white text-[11px] font-semibold shadow-md opacity-0 pointer-events-none transition-opacity duration-150">
                                第1行 第1列 · 格 #1
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>

    </div>

    <!-- ==============================================
         交互与逻辑核心驱动脚本
         ============================================== -->
    <script>
        (function () {
            'use strict';

            // 1. 颜色与常量配置（白底高对比度鲜明调色）
            const COLOR_CONFIG = {
                NONE: 'NONE',
                A: { id: 'A', name: '颜色 A', hex: '#0ea5e9', class: 'colored-a', value: 0.18 },
                B: { id: 'B', name: '颜色 B', hex: '#f97316', class: 'colored-b', value: 0.18 },
                C: { id: 'C', name: '颜色 C', hex: '#8b5cf6', class: 'colored-c', value: 0.18 }
            };

            // 2. 响应式应用状态
            const state = {
                // 当前笔刷工具：'A' | 'B' | 'C' | 'ERASER'
                activeTool: 'A',
                // 100个格子的颜色数据：Array(100).fill('NONE')
                cells: Array(100).fill('NONE'),
                // 当前视图模式：'single' (合并/单大正方形)
                viewMode: 'single',
                // 合并模式下的排布样式：'split-rows' (每种颜色占两行) | 'compact' (连续紧凑拼接54格)
                packingMode: 'split-rows',
                // 拖拽绘制状态
                isPointerDown: false,
                lastPaintedIndex: -1,
                // 音效开关
                soundEnabled: true
            };

            // 3. Web Audio API 轻量级合成音效 (无外部依赖)
            let audioCtx = null;
            function getAudioContext() {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        audioCtx = new AudioContext();
                    }
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                return audioCtx;
            }

            function playSound(type) {
                if (!state.soundEnabled) return;
                try {
                    const ctx = getAudioContext();
                    if (!ctx) return;
                    const now = ctx.currentTime;

                    if (type === 'paint') {
                        // 涂色音效：清脆水滴声
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        const freq = state.activeTool === 'A' ? 680 : (state.activeTool === 'B' ? 580 : 760);
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now);
                        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.05);

                        gain.gain.setValueAtTime(0.08, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.07);
                    } else if (type === 'erase') {
                        // 擦除音效：柔和低频噗声
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(320, now);
                        osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);

                        gain.gain.setValueAtTime(0.08, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.08);
                    } else if (type === 'fill18') {
                        // 阶梯琶音 (完成快速填充)
                        const freqs = [440, 554, 659, 880];
                        freqs.forEach((f, idx) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            const t = now + idx * 0.04;
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(f, t);
                            gain.gain.setValueAtTime(0.09, t);
                            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.start(t);
                            osc.stop(t + 0.12);
                        });
                    } else if (type === 'merge') {
                        // 合并汇聚升调音效
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(350, now);
                        osc.frequency.exponentialRampToValueAtTime(700, now + 0.25);
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.28);
                    } else if (type === 'clear') {
                        // 清空音效
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(450, now);
                        osc.frequency.exponentialRampToValueAtTime(120, now + 0.15);
                        gain.gain.setValueAtTime(0.08, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.16);
                    }
                } catch (e) {
                    console.warn('Audio playback error', e);
                }
            }

            // 4. DOM 元素缓存
            const mainBoardEl = document.getElementById('main-grid-board');
            const viewSingleEl = document.getElementById('view-single-grid');

            const btnToolA = document.getElementById('btn-tool-a');
            const btnToolB = document.getElementById('btn-tool-b');
            const btnToolC = document.getElementById('btn-tool-c');
            const btnToolEraser = document.getElementById('btn-tool-eraser');
            const toolButtons = [btnToolA, btnToolB, btnToolC, btnToolEraser];

            const btnQuick18 = document.getElementById('btn-quick-18');
            const btnClearAll = document.getElementById('btn-clear-all');
            const btnSoundToggle = document.getElementById('btn-sound-toggle');
            const iconSound = document.getElementById('icon-sound');

            const btnPackSplitRows = document.getElementById('btn-pack-split-rows');
            const btnPackCompact = document.getElementById('btn-pack-compact');

            const gridHoverTip = document.getElementById('grid-hover-tip');

            // 5. 初始化 10×10 大网格 DOM
            function initGrids() {
                mainBoardEl.innerHTML = '';
                for (let i = 0; i < 100; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.dataset.index = i;
                    mainBoardEl.appendChild(cell);
                }
                renderCells();
            }

            // 6. 渲染大网格中的颜色与类名
            function renderCells() {
                const domCells = mainBoardEl.children;
                for (let i = 0; i < 100; i++) {
                    const cellEl = domCells[i];
                    const color = state.cells[i];
                    cellEl.classList.remove('colored-a', 'colored-b', 'colored-c');

                    if (color === 'A') {
                        cellEl.classList.add('colored-a');
                    } else if (color === 'B') {
                        cellEl.classList.add('colored-b');
                    } else if (color === 'C') {
                        cellEl.classList.add('colored-c');
                    }
                }
            }

            // 7. 工具选择切换逻辑（白底模式外观）
            function setActiveTool(tool) {
                state.activeTool = tool;

                toolButtons.forEach(btn => {
                    const btnTool = btn.dataset.tool;
                    if (btnTool === tool) {
                        btn.className = 'tool-btn flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs md:text-sm font-bold transition-all duration-200 cursor-pointer bg-white text-slate-900 shadow-md ring-2 ring-sky-500/40 scale-105';
                    } else {
                        btn.className = 'tool-btn flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs md:text-sm font-semibold transition-all duration-200 cursor-pointer text-slate-600 hover:text-slate-900';
                    }
                });
            }

            // 8. 涂色与擦除核心动作 (PRD 3.1 & 3.3)
            function paintCellAtIndex(index) {
                if (index < 0 || index >= 100) return;
                if (state.lastPaintedIndex === index) return; // 避免同格重复触发

                state.lastPaintedIndex = index;
                const newColor = state.activeTool === 'ERASER' ? 'NONE' : state.activeTool;

                if (state.cells[index] !== newColor) {
                    state.cells[index] = newColor;
                    const cellEl = mainBoardEl.children[index];
                    cellEl.classList.remove('colored-a', 'colored-b', 'colored-c');

                    if (newColor === 'A') cellEl.classList.add('colored-a');
                    else if (newColor === 'B') cellEl.classList.add('colored-b');
                    else if (newColor === 'C') cellEl.classList.add('colored-c');

                    playSound(newColor === 'NONE' ? 'erase' : 'paint');
                }
            }

            // 9. 触控与拖拽滑动涂色事件监听 (PointerEvent + elementFromPoint)
            function setupPointerPainting() {
                // 指针按下开始涂色
                mainBoardEl.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    state.isPointerDown = true;
                    state.lastPaintedIndex = -1;

                    try {
                        mainBoardEl.setPointerCapture(e.pointerId);
                    } catch (err) { }

                    const target = document.elementFromPoint(e.clientX, e.clientY);
                    if (target && target.classList.contains('grid-cell')) {
                        const idx = parseInt(target.dataset.index, 10);
                        paintCellAtIndex(idx);
                        updateHoverTip(target, idx);
                    }
                });

                // 指针连续滑动
                mainBoardEl.addEventListener('pointermove', (e) => {
                    const target = document.elementFromPoint(e.clientX, e.clientY);
                    if (target && target.classList.contains('grid-cell')) {
                        const idx = parseInt(target.dataset.index, 10);
                        updateHoverTip(target, idx);

                        if (state.isPointerDown) {
                            e.preventDefault();
                            paintCellAtIndex(idx);
                        }
                    } else {
                        gridHoverTip.style.opacity = '0';
                    }
                });

                // 结束涂色
                const stopPainting = (e) => {
                    state.isPointerDown = false;
                    state.lastPaintedIndex = -1;
                    if (e && e.pointerId) {
                        try {
                            mainBoardEl.releasePointerCapture(e.pointerId);
                        } catch (err) { }
                    }
                };

                mainBoardEl.addEventListener('pointerup', stopPainting);
                mainBoardEl.addEventListener('pointercancel', stopPainting);
                document.addEventListener('pointerup', () => {
                    state.isPointerDown = false;
                });

                mainBoardEl.addEventListener('pointerleave', () => {
                    gridHoverTip.style.opacity = '0';
                });
            }

            // 悬浮提示信息展示
            function updateHoverTip(cellEl, idx) {
                const row = Math.floor(idx / 10) + 1;
                const col = (idx % 10) + 1;
                gridHoverTip.textContent = `第${row}行 第${col}列 · 格 #${idx + 1}`;
                gridHoverTip.style.opacity = '1';
            }

            // 10. 快捷生成 18 格按钮逻辑 (PRD 3.2 严格排布规则)
            function generate18BlocksForColor(targetColor = null) {
                let color = targetColor || state.activeTool;
                if (color === 'ERASER' || !['A', 'B', 'C'].includes(color)) {
                    color = 'A';
                    setActiveTool('A');
                }

                // 统计各颜色当前已有数量
                const countA = state.cells.filter(c => c === 'A').length;
                const countB = state.cells.filter(c => c === 'B').length;
                const countC = state.cells.filter(c => c === 'C').length;

                // 如果未显式传参且当前选中的颜色已经生成了18格，自动顺延到下一个未满18格的颜色
                if (!targetColor) {
                    if (color === 'A' && countA >= 18) {
                        if (countB < 18) {
                            color = 'B';
                            setActiveTool('B');
                        } else if (countC < 18) {
                            color = 'C';
                            setActiveTool('C');
                        }
                    } else if (color === 'B' && countB >= 18) {
                        if (countC < 18) {
                            color = 'C';
                            setActiveTool('C');
                        } else if (countA < 18) {
                            color = 'A';
                            setActiveTool('A');
                        }
                    } else if (color === 'C' && countC >= 18) {
                        if (countA < 18) {
                            color = 'A';
                            setActiveTool('A');
                        } else if (countB < 18) {
                            color = 'B';
                            setActiveTool('B');
                        }
                    }
                }

                // 先将网格中属于该颜色的旧格子置空，保持其他颜色不受影响
                for (let i = 0; i < 100; i++) {
                    if (state.cells[i] === color) {
                        state.cells[i] = 'NONE';
                    }
                }

                if (state.packingMode === 'compact') {
                    // 紧凑拼接排布 (每个颜色占18格)
                    let start = 0;
                    if (color === 'A') start = 0;
                    else if (color === 'B') start = 18;
                    else if (color === 'C') start = 36;

                    for (let i = start; i < start + 18; i++) {
                        state.cells[i] = color;
                    }
                } else {
                    // 分行对比排布 (每组独立占2行：10格+8格)
                    let rowStart = 0;
                    if (color === 'A') rowStart = 0;
                    else if (color === 'B') rowStart = 20;
                    else if (color === 'C') rowStart = 40;

                    for (let i = rowStart; i < rowStart + 10; i++) {
                        state.cells[i] = color;
                    }
                    for (let i = rowStart + 10; i < rowStart + 18; i++) {
                        state.cells[i] = color;
                    }
                }

                playSound('fill18');
                renderCells();
            }

            // 11. 排布样式切换（分行对比 vs 紧凑拼满，重排已有颜色）
            function setPackingMode(mode) {
                state.packingMode = mode;
                if (mode === 'split-rows') {
                    btnPackSplitRows.className = 'px-3 py-1.5 rounded-lg font-bold text-sky-700 bg-white shadow-xs border border-slate-200/90 transition-all cursor-pointer';
                    btnPackCompact.className = 'px-3 py-1.5 rounded-lg font-semibold text-slate-500 hover:text-slate-800 transition-all cursor-pointer';
                } else {
                    btnPackCompact.className = 'px-3 py-1.5 rounded-lg font-bold text-sky-700 bg-white shadow-xs border border-slate-200/90 transition-all cursor-pointer';
                    btnPackSplitRows.className = 'px-3 py-1.5 rounded-lg font-semibold text-slate-500 hover:text-slate-800 transition-all cursor-pointer';
                }

                const hasA = state.cells.includes('A');
                const hasB = state.cells.includes('B');
                const hasC = state.cells.includes('C');

                // 若网格中已有色块，按当前模式重新排布已有的颜色
                if (hasA || hasB || hasC) {
                    state.cells.fill('NONE');
                    if (mode === 'compact') {
                        if (hasA) for (let i = 0; i < 18; i++) state.cells[i] = 'A';
                        if (hasB) for (let i = 18; i < 36; i++) state.cells[i] = 'B';
                        if (hasC) for (let i = 36; i < 54; i++) state.cells[i] = 'C';
                    } else {
                        if (hasA) {
                            for (let i = 0; i < 10; i++) state.cells[i] = 'A';
                            for (let i = 10; i < 18; i++) state.cells[i] = 'A';
                        }
                        if (hasB) {
                            for (let i = 20; i < 30; i++) state.cells[i] = 'B';
                            for (let i = 30; i < 38; i++) state.cells[i] = 'B';
                        }
                        if (hasC) {
                            for (let i = 40; i < 50; i++) state.cells[i] = 'C';
                            for (let i = 50; i < 58; i++) state.cells[i] = 'C';
                        }
                    }
                    playSound('merge');
                    renderCells();
                }
            }

            // 12. 事件监听绑定
            function bindEvents() {
                // 笔刷切换按钮
                toolButtons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        setActiveTool(btn.dataset.tool);
                        playSound('paint');
                    });
                });

                // 快捷生成 18 格 (针对单一颜色生成 18 块)
                btnQuick18.addEventListener('click', () => {
                    generate18BlocksForColor();
                });

                // 全部清空
                btnClearAll.addEventListener('click', () => {
                    state.cells.fill('NONE');
                    renderCells();
                    playSound('clear');
                });

                // 音效开关
                btnSoundToggle.addEventListener('click', () => {
                    state.soundEnabled = !state.soundEnabled;
                    if (state.soundEnabled) {
                        iconSound.classList.remove('text-slate-400');
                        iconSound.classList.add('text-sky-600');
                        playSound('paint');
                    } else {
                        iconSound.classList.remove('text-sky-600');
                        iconSound.classList.add('text-slate-400');
                    }
                });

                // 分行 vs 紧凑排布切换
                btnPackSplitRows.addEventListener('click', () => setPackingMode('split-rows'));
                btnPackCompact.addEventListener('click', () => setPackingMode('compact'));
            }

            // 13. 初始化启动
            initGrids();
            setupPointerPainting();
            bindEvents();
            setActiveTool('A');

        })();
    </script>
</body>
